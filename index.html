<!doctype html>
<html lang="en">
<head>
<meta name="description" content="Interactive, illustrated SQL cheat sheets with real PostgreSQL results: basics, joins, aggregates, functions, window functions, data analysis, PostgreSQL and interview prep.">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SQL Cheat Sheets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Caveat:wght@500;700&family=Dancing+Script:wght@600;700&family=JetBrains+Mono:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: a black, single-theme reference site. Hub (mind map, quick reference, sample data) routes by #hash to one sheet at a time.
   Each example card reads top to bottom: diagram, task, query, real result. Purple-pink identity, blue for structure. */
:root {
  color-scheme: dark;
  --bg: #0a0a0d;
  --fg: #eeeaf4;
  --muted: #a7a1b4;
  --faint: #6f6a7b;
  --rule: #25242e;
  --card: #131319;
  --card2: #1a1922;
  --chip: #23222c;
  --pink: #f39ac8;
  --violet: #b9a0ff;
  --blue: #8ab4ff;
  --blue-deep: #172240;
  --coral: #ff6b5e;
  --mint: #6fe3a6;
  --tan: #c9a063;
  --code-bg: #0e0f15;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Source Serif 4", Charter, Georgia, serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --font-hand: "Caveat", "Bradley Hand", "Chalkboard SE", cursive;
  --font-sign: "Dancing Script", "Snell Roundhand", "Apple Chancery", cursive;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 1.06rem; line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 4rem;
}
main { max-width: 74rem; margin: 0 auto; }
p { margin: 0; }
a { color: var(--blue); }
button { font: inherit; color: inherit; }
::selection { background: #5b3fb0; color: #fff; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }

/* top bar */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-block: 1.1rem 0; flex-wrap: wrap; }
.brand { font-family: var(--font-sign); font-weight: 700; font-size: 1.75rem; color: var(--pink); text-decoration: none; }
.crumbs { font-family: var(--font-display); font-weight: 600; font-size: 0.9rem; color: var(--muted); display: flex; gap: 0.45rem; align-items: center; flex-wrap: wrap; }
.crumbs a { color: var(--blue); text-decoration: none; }

/* hero */
.hero { padding-block: 2.4rem 1.6rem; display: grid; gap: 0.85rem; }
.eyebrow { font-family: var(--font-hand); font-size: 1.45rem; color: var(--blue); }
h1 { font-family: var(--font-sign); font-weight: 700; font-size: clamp(2.9rem, 8vw, 4.6rem); line-height: 1.05; margin: 0; color: #fff; text-wrap: balance; }
h1 .hl { background: linear-gradient(transparent 64%, rgba(243, 154, 200, 0.45) 64%); padding-inline: 0.12em; }
.lede { font-size: 1.18rem; color: var(--muted); max-width: 46rem; }
.stats { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 0.3rem; }
.stat { font-family: var(--font-display); font-weight: 700; font-size: 0.85rem; color: var(--fg); background: var(--card2); border: 1px solid var(--rule); border-radius: 999px; padding: 0.3rem 0.85rem; }
.stat b { color: var(--pink); }

/* search */
.search { position: relative; max-width: 38rem; margin-top: 0.6rem; }
.search input { width: 100%; font-family: var(--font-body); font-size: 1.05rem; padding: 0.8rem 1rem 0.8rem 2.7rem; border-radius: 999px; border: 1.5px solid var(--rule); background: var(--card); color: var(--fg); }
.search input::placeholder { color: var(--faint); }
.search input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 4px rgba(138, 180, 255, 0.18); }
.search svg { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; }
.results { display: grid; gap: 0.5rem; margin-top: 0.8rem; max-width: 46rem; }
.result { display: grid; grid-template-columns: 7.5rem 1fr; gap: 0.15rem 0.8rem; text-align: left; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 0.65rem 0.95rem; cursor: pointer; }
.result:hover { border-color: var(--blue); }
.result .r-sheet { font-family: var(--font-display); font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--blue); padding-top: 0.25rem; }
.result .r-name { font-family: var(--font-mono); font-size: 0.9rem; font-weight: 600; color: var(--pink); }
.result .r-desc { grid-column: 2; color: var(--muted); font-size: 0.95rem; }
.empty { color: var(--muted); font-style: italic; }

/* section titles */
h2.section-title { font-family: var(--font-sign); font-weight: 700; font-size: clamp(2.1rem, 5vw, 2.8rem); margin: 3rem 0 0.4rem; line-height: 1.15; color: #fff; }
.section-sub { color: var(--muted); margin-bottom: 1.1rem; max-width: 46rem; }

/* illustration panels (shared with diagrams) */
.panel { background: #47577a; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 100% 64px; border-radius: 18px; padding: 0.8rem; overflow-x: auto; box-shadow: 0 0 0 1px rgba(255,255,255,0.06); }
.mindmap svg { display: block; width: 100%; min-width: 48rem; height: auto; }
.map-cap { display: flex; justify-content: center; margin-top: 0.8rem; }
.map-cap span { font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; color: #fff; background: #22252e; border-radius: 12px; padding: 0.5rem 1rem; box-shadow: 0 4px 0 rgba(0,0,0,0.35); text-align: center; }
.map-cap em { font-style: normal; color: var(--coral); }
svg text { font-family: var(--font-hand); }
svg .rough { filter: url(#rough); }
svg .node { cursor: pointer; }
svg .node:hover rect:last-of-type, svg .node:focus rect:last-of-type { stroke: #fff; stroke-width: 3.5; }
svg .node:focus { outline: none; }
svg .leaf { cursor: pointer; }
svg .leaf:hover text { fill: #fff; text-decoration: underline; }

/* sheet cards on hub */
.sheets { display: grid; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); gap: 1rem; }
.sheet-card { display: grid; gap: 0.55rem; align-content: start; text-align: left; background: var(--card); border: 1px solid var(--rule); border-radius: 16px; padding: 1.05rem 1.15rem; cursor: pointer; min-width: 0; }
.sheet-card:hover { border-color: var(--pink); transform: translateY(-2px); }
.sc-top { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #22252e; flex: none; box-shadow: 0 0 0 2px rgba(255,255,255,0.12); }
.level { font-family: var(--font-display); font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--blue); background: var(--blue-deep); border-radius: 999px; padding: 0.14rem 0.6rem; }
.sheet-card h3 { font-family: var(--font-display); font-weight: 800; font-size: 1.22rem; margin: 0; line-height: 1.2; color: #fff; }
.sheet-card p { color: var(--muted); font-size: 0.97rem; }
.bar { height: 6px; border-radius: 99px; background: var(--chip); overflow: hidden; }
.bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--pink), var(--blue)); border-radius: 99px; }
.sc-meta { font-family: var(--font-display); font-size: 0.8rem; color: var(--muted); }

/* quick reference */
.ref { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); gap: 1rem; }
.ref-card { background: var(--card); border: 1px solid var(--rule); border-radius: 16px; padding: 1rem 1.1rem; display: grid; gap: 0.7rem; align-content: start; min-width: 0; }
.ref-card h3 { font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; margin: 0; color: #fff; }
.flow { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
.flow span { font-family: var(--font-mono); font-weight: 600; font-size: 0.8rem; border-radius: 8px; padding: 0.25rem 0.55rem; color: #1d1726; border: 2px solid #22252e; box-shadow: 0 3px 0 rgba(0,0,0,0.4); }
.flow i { color: var(--tan); font-style: normal; font-weight: 700; }
.legend-row { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; color: var(--muted); font-size: 0.92rem; }
.legend-row b { color: var(--fg); font-family: var(--font-mono); font-size: 0.85rem; }
.samples { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 30rem), 1fr)); gap: 1rem; }
.sample h4 { font-family: var(--font-mono); font-size: 0.95rem; color: var(--pink); margin: 0 0 0.4rem; }

/* sheet page */
.sheet-head { padding-block: 2rem 1.2rem; display: grid; gap: 0.7rem; }
.sheet-head .row { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
.chips { display: flex; flex-wrap: wrap; gap: 0.45rem; margin: 1.4rem 0 0.2rem; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 0.6rem; }
.chip-btn { font-family: var(--font-display); font-weight: 700; font-size: 0.85rem; background: var(--card); color: var(--fg); border: 1px solid var(--rule); border-radius: 999px; padding: 0.32rem 0.85rem; cursor: pointer; }
.chip-btn:hover { border-color: var(--pink); color: var(--pink); }
.sec { margin-top: 2.2rem; scroll-margin-top: 4rem; }
.sec-head { display: flex; align-items: baseline; gap: 0.8rem; margin-bottom: 1rem; flex-wrap: wrap; }
.sec h2 { font-family: var(--font-sign); font-weight: 700; font-size: clamp(1.9rem, 4.5vw, 2.4rem); margin: 0; line-height: 1.15; color: #fff; }
.sec-count { font-family: var(--font-display); font-size: 0.8rem; color: var(--faint); }
.items { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 31rem), 1fr)); gap: 1.1rem; }

/* example card */
.item { background: var(--card); border: 1px solid var(--rule); border-radius: 18px; padding: 1rem 1.05rem 1.1rem; display: grid; gap: 0.75rem; align-content: start; min-width: 0; scroll-margin-top: 4.5rem; }
.item.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 3px var(--pink); } 100% { box-shadow: 0 0 0 0 transparent; } }
.item-head { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; }
.item-name { font-family: var(--font-mono); font-weight: 600; font-size: 0.95rem; color: var(--pink); }
.got { display: inline-flex; align-items: center; gap: 0.35rem; font-family: var(--font-display); font-size: 0.78rem; color: var(--muted); cursor: pointer; white-space: nowrap; user-select: none; }
.got input { accent-color: var(--pink); width: 1rem; height: 1rem; }
.task { font-family: var(--font-display); font-weight: 700; font-size: 1.08rem; line-height: 1.35; color: #fff; }
.task::before { content: "Task "; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #1d1726; background: var(--tan); border-radius: 5px; padding: 0.08rem 0.4rem; margin-right: 0.5rem; vertical-align: 0.12em; }
.viz { background: #47577a; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 100% 30px; border-radius: 14px; padding: 0.55rem; }
.viz svg { display: block; width: 100%; height: auto; max-height: 12.5rem; }
.viz text:not([font-family]) { font-family: var(--font-display); }
.viz text[font-family] { font-family: var(--font-mono); }
.code { background: var(--code-bg); border: 1px solid var(--rule); border-radius: 12px; position: relative; min-width: 0; }
.code pre { margin: 0; padding: 0.75rem 0.9rem; overflow-x: auto; font-family: var(--font-mono); font-size: 0.82rem; line-height: 1.6; color: #e6edf3; }
.copy { position: absolute; top: 0.45rem; right: 0.45rem; font-family: var(--font-mono); font-size: 0.7rem; color: #c7cfdb; background: #1b1d29; border: 1px solid #343a47; border-radius: 6px; padding: 0.12rem 0.5rem; cursor: pointer; }
.copy:hover { border-color: #8b93a3; }
.tk-kw { color: #ff7b9c; } .tk-fn { color: #c9a7ff; } .tk-str { color: #a5d6ff; } .tk-num { color: #79c0ff; } .tk-com { color: #7d8590; font-style: italic; } .tk-op { color: #ffb86b; } .tk-meta { color: #7ee0c3; }
.res-label { display: flex; align-items: center; gap: 0.5rem; font-family: var(--font-display); font-weight: 800; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mint); }
.res-label::before { content: ""; width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 8px solid var(--mint); }
.res-label.err { color: var(--coral); }
.res-label.err::before { border-top-color: var(--coral); }
.res-label .more { color: var(--faint); font-weight: 600; letter-spacing: 0.02em; text-transform: none; }
.tbl { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; background: #101016; }
.tbl table { border-collapse: collapse; width: 100%; font-family: var(--font-mono); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { padding: 0.36rem 0.7rem; border-bottom: 1px solid var(--rule); text-align: left; white-space: nowrap; }
.tbl th { font-family: var(--font-display); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.05em; color: #e3d6ff; background: #261f44; }
.tbl tr:nth-child(even) td { background: #15141c; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.null { color: var(--faint); font-style: italic; }
.tbl td.num { text-align: right; color: #cfe0ff; }
.err-box { font-family: var(--font-mono); font-size: 0.82rem; color: #ffd2cc; background: #2a1414; border: 1px solid #5a2622; border-radius: 10px; padding: 0.55rem 0.75rem; }
.note { display: grid; grid-template-columns: auto 1fr; gap: 0.55rem; background: var(--blue-deep); border: 1px solid #2c3d6e; border-radius: 12px; padding: 0.55rem 0.8rem; font-size: 0.95rem; color: #dfe7ff; }
code.inline { font-family: var(--font-mono); font-size: 0.85em; font-weight: 600; background: var(--chip); color: var(--fg); border-radius: 6px; padding: 0.05em 0.35em; }

/* flip cards (crossfade: reliable inside buttons on every browser) */
.flip { position: relative; min-height: 10.5rem; cursor: pointer; border: 0; background: none; padding: 0; text-align: left; width: 100%; display: grid; }
.flip-inner { display: grid; }
.face { grid-area: 1 / 1; border-radius: 18px; padding: 1rem 1.15rem; display: grid; align-content: center; gap: 0.5rem; min-height: 10.5rem; transition: opacity 0.25s ease, transform 0.25s ease; }
.face.front { background: var(--card); border: 1px solid var(--rule); }
.face.back { background: #241c3d; border: 1px solid #4b3a7d; opacity: 0; transform: scale(0.98); }
.flip.on .face.front { opacity: 0; transform: scale(0.98); }
.flip.on .face.back { opacity: 1; transform: none; }
.flip:hover .face.front { border-color: var(--pink); }
.face .q { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; line-height: 1.3; color: #fff; }
.face .hint { font-family: var(--font-hand); font-size: 1.3rem; color: var(--pink); }
.face .a { font-size: 1rem; color: #ece6ff; }
.face .a::before { content: "Answer"; display: block; font-family: var(--font-display); font-size: 0.7rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--pink); margin-bottom: 0.3rem; }
@media (prefers-reduced-motion: reduce) { .face { transition: none; } .sheet-card:hover { transform: none; } }

.pager { display: flex; justify-content: space-between; gap: 1rem; margin-top: 2.8rem; flex-wrap: wrap; }
.pager button { font-family: var(--font-display); font-weight: 700; background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 0.75rem 1.05rem; cursor: pointer; text-align: left; }
.pager button:hover { border-color: var(--pink); color: var(--pink); }
.pager small { display: block; font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }
.tip { display: grid; grid-template-columns: auto 1fr; gap: 0.55rem; margin-top: 2rem; background: var(--card2); border: 1px solid var(--rule); border-radius: 14px; padding: 0.75rem 0.95rem; color: var(--muted); }
footer { margin-top: 3rem; padding-top: 1.2rem; border-top: 1px dashed var(--rule); color: var(--muted); font-size: 0.95rem; display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem 1.5rem; flex-wrap: wrap; }
footer .sign { font-family: var(--font-sign); font-weight: 700; font-size: 2rem; color: var(--pink); line-height: 1; }
@media (prefers-reduced-motion: no-preference) { .sheet-card, .chip-btn, .result { transition: border-color 0.15s, transform 0.15s, color 0.15s; } }
@media (max-width: 560px) { body { font-size: 1rem; } .result { grid-template-columns: 1fr; } .result .r-desc { grid-column: 1; } }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9 z" fill="#c9a063" stroke="#22252e" stroke-width="1"/>
    </marker>
  </defs>
</svg>

<main id="app" aria-live="polite"></main>

<script>
(function () {
var DATA = {"sheets": [{"id": "basics", "title": "SQL Basics", "short": "Basics", "level": "Beginner", "blurb": "Read, filter, sort and change rows: the part of SQL you use every day.", "sections": [{"title": "Querying", "items": [{"name": "SELECT ... FROM", "task": "List every customer's name and city.", "sql": "SELECT name, city\nFROM customers;", "v": "select", "result": {"cols": ["name", "city"], "rows": [["Asha", "Pune"], ["Ben", "Leeds"], ["Chen", "Pune"], ["Dee", "Austin"], ["Eli", "Leeds"], ["Fay", "Austin"]], "total": 6}}, {"name": "AS (aliases)", "task": "Rename columns in the output and give the table a short name.", "sql": "SELECT c.name AS customer, c.city AS lives_in\nFROM customers AS c;", "v": "alias", "result": {"cols": ["customer", "lives_in"], "rows": [["Asha", "Pune"], ["Ben", "Leeds"], ["Chen", "Pune"], ["Dee", "Austin"], ["Eli", "Leeds"], ["Fay", "Austin"]], "total": 6}}, {"name": "DISTINCT", "task": "Which cities do customers live in?", "sql": "SELECT DISTINCT city\nFROM customers\nORDER BY city;", "v": "distinct", "result": {"cols": ["city"], "rows": [["Austin"], ["Leeds"], ["Pune"]], "total": 3}}, {"name": "ORDER BY", "task": "Products from most to least expensive.", "sql": "SELECT title, price\nFROM products\nORDER BY price DESC;", "v": "sort", "result": {"cols": ["title", "price"], "rows": [["Graph Theory Gently", "40.00"], ["Data Made Simple", "32.00"], ["SQL in Pictures", "27.50"], ["The Night Library", "18.00"], ["Quiet Rivers", "15.00"], ["Moon Bears", "12.00"]], "total": 6}}, {"name": "LIMIT / OFFSET", "task": "The 3 most expensive products, then the next 2.", "sql": "SELECT title, price\nFROM products\nORDER BY price DESC\nLIMIT 3;", "v": "limit", "note": "Add OFFSET 3 to get the next page. Without ORDER BY, LIMIT returns arbitrary rows.", "result": {"cols": ["title", "price"], "rows": [["Graph Theory Gently", "40.00"], ["Data Made Simple", "32.00"], ["SQL in Pictures", "27.50"]], "total": 3}}]}, {"title": "Filtering", "items": [{"name": "WHERE", "task": "Paid orders worth more than 30.", "sql": "SELECT order_id, amount\nFROM orders\nWHERE status = 'paid' AND amount > 30;", "v": "filter", "result": {"cols": ["order_id", "amount"], "rows": [["101", "32.00"], ["102", "36.00"], ["103", "36.00"], ["105", "32.00"], ["107", "55.00"], ["110", "32.00"]], "total": 6}}, {"name": "AND / OR", "task": "Orders that are refunded, or pending and over 20. Brackets matter.", "sql": "SELECT order_id, status, amount\nFROM orders\nWHERE status = 'refunded'\n   OR (status = 'pending' AND amount > 20);", "v": "filter", "result": {"cols": ["order_id", "status", "amount"], "rows": [["104", "refunded", "27.50"], ["109", "pending", "24.00"]], "total": 2}}, {"name": "BETWEEN", "task": "Products priced from 15 to 30, both ends included.", "sql": "SELECT title, price\nFROM products\nWHERE price BETWEEN 15 AND 30;", "v": "between", "result": {"cols": ["title", "price"], "rows": [["The Night Library", "18.00"], ["SQL in Pictures", "27.50"], ["Quiet Rivers", "15.00"]], "total": 3}}, {"name": "IN", "task": "Customers in Pune or Austin.", "sql": "SELECT name, city\nFROM customers\nWHERE city IN ('Pune', 'Austin');", "v": "between", "result": {"cols": ["name", "city"], "rows": [["Asha", "Pune"], ["Chen", "Pune"], ["Dee", "Austin"], ["Fay", "Austin"]], "total": 4}}, {"name": "LIKE / ILIKE", "task": "Titles containing the word 'data', in any case.", "sql": "SELECT title\nFROM products\nWHERE title ILIKE '%data%';", "v": "like", "note": "LIKE is case-sensitive; ILIKE (Postgres) is not. % matches any run of characters, _ matches one.", "result": {"cols": ["title"], "rows": [["Data Made Simple"]], "total": 1}}, {"name": "IS NULL", "task": "Customers with no email on file.", "sql": "SELECT name\nFROM customers\nWHERE email IS NULL;", "v": "isnull", "note": "email = NULL never matches. Use IS NULL / IS NOT NULL.", "result": {"cols": ["name"], "rows": [["Chen"]], "total": 1}}]}, {"title": "Computed columns", "items": [{"name": "Arithmetic", "task": "Price including 18% tax, rounded to cents.", "sql": "SELECT title, price,\n       ROUND(price * 1.18, 2) AS price_with_tax\nFROM products\nORDER BY price\nLIMIT 3;", "v": "round", "io": [["12.00 × 1.18", "14.16"], ["18.00 × 1.18", "21.24"]], "result": {"cols": ["title", "price", "price_with_tax"], "rows": [["Moon Bears", "12.00", "14.16"], ["Quiet Rivers", "15.00", "17.70"], ["The Night Library", "18.00", "21.24"]], "total": 3}}, {"name": "Text and CASE", "task": "Label each product as cheap or premium.", "sql": "SELECT title,\n       CASE WHEN price >= 25 THEN 'premium' ELSE 'cheap' END AS tier\nFROM products;", "v": "case", "result": {"cols": ["title", "tier"], "rows": [["The Night Library", "cheap"], ["Data Made Simple", "premium"], ["SQL in Pictures", "premium"], ["Moon Bears", "cheap"], ["Quiet Rivers", "cheap"], ["Graph Theory Gently", "premium"]], "total": 6}}]}, {"title": "Changing data", "items": [{"name": "INSERT", "task": "Add a new customer and return the stored row.", "sql": "INSERT INTO customers (customer_id, name, city, signup_date)\nVALUES (7, 'Gus', 'Pune', '2024-04-10')\nRETURNING *;", "v": "insert", "result": {"cols": ["customer_id", "name", "city", "signup_date", "email", "referred_by"], "rows": [["7", "Gus", "Pune", "2024-04-10", "NULL", "NULL"]], "total": 1}}, {"name": "UPDATE", "task": "Raise Data book prices by 10%.", "sql": "UPDATE products\nSET price = ROUND(price * 1.10, 2)\nWHERE category = 'Data'\nRETURNING title, price;", "v": "update", "note": "Without WHERE, every row changes. Run the WHERE as a SELECT first.", "result": {"cols": ["title", "price"], "rows": [["Data Made Simple", "35.20"], ["SQL in Pictures", "30.25"], ["Graph Theory Gently", "44.00"]], "total": 3}}, {"name": "DELETE", "task": "Remove refunded orders.", "sql": "DELETE FROM orders\nWHERE status = 'refunded'\nRETURNING order_id, status;", "v": "delete", "result": {"cols": ["order_id", "status"], "rows": [["104", "refunded"]], "total": 1}}]}, {"title": "Tables and constraints", "items": [{"name": "CREATE TABLE", "task": "Create a reviews table with keys and a rating rule.", "sql": "CREATE TEMP TABLE reviews (\n  review_id  int PRIMARY KEY,\n  product_id int NOT NULL,\n  rating     int CHECK (rating BETWEEN 1 AND 5),\n  body       text\n);", "v": "create", "result": {"cols": ["column_name", "data_type", "is_nullable"], "rows": [["review_id", "integer", "NO"], ["product_id", "integer", "NO"], ["rating", "integer", "YES"], ["body", "text", "YES"]], "total": 4}, "show": "SELECT column_name, data_type, is_nullable\nFROM information_schema.columns\nWHERE table_name = 'reviews'\nORDER BY ordinal_position;"}, {"name": "ALTER TABLE", "task": "Add a tier column to products.", "sql": "ALTER TABLE products ADD COLUMN tier text DEFAULT 'standard';", "v": "alter", "result": {"cols": ["title", "tier"], "rows": [["The Night Library", "standard"], ["Data Made Simple", "standard"], ["SQL in Pictures", "standard"]], "total": 3}, "show": "SELECT title, tier FROM products LIMIT 3;"}, {"name": "Constraints in action", "task": "Try to insert a 7-star review. The CHECK constraint refuses it.", "sql": "CREATE TEMP TABLE reviews (review_id int PRIMARY KEY, rating int CHECK (rating BETWEEN 1 AND 5));\nINSERT INTO reviews VALUES (1, 7);", "v": "constraint", "result": {"error": "new row for relation \"reviews\" violates check constraint \"reviews_rating_check\""}}]}]}, {"id": "joins", "title": "SQL Joins", "short": "Joins", "level": "Beginner", "blurb": "Combine tables by matching rows. Pick the join by asking which rows must survive.", "sections": [{"title": "The core joins", "items": [{"name": "INNER JOIN", "task": "Each order with the customer's name. Only matching rows.", "sql": "SELECT o.order_id, c.name, o.amount\nFROM orders o\nJOIN customers c ON c.customer_id = o.customer_id\nORDER BY o.order_id\nLIMIT 5;", "v": "vinner", "result": {"cols": ["order_id", "name", "amount"], "rows": [["101", "Asha", "32.00"], ["102", "Ben", "36.00"], ["103", "Asha", "36.00"], ["104", "Chen", "27.50"], ["105", "Dee", "32.00"]], "total": 5}}, {"name": "LEFT JOIN", "task": "Every customer and their orders, including customers who never ordered.", "sql": "SELECT c.name, o.order_id\nFROM customers c\nLEFT JOIN orders o ON o.customer_id = c.customer_id\nWHERE c.customer_id IN (5, 6);", "v": "vleft", "note": "Fay has no orders, so her order_id is NULL.", "result": {"cols": ["name", "order_id"], "rows": [["Eli", "107"], ["Fay", "NULL"]], "total": 2}}, {"name": "RIGHT JOIN", "task": "Same as LEFT JOIN with the tables swapped. Every product, sold or not.", "sql": "SELECT p.title, o.order_id\nFROM orders o\nRIGHT JOIN products p ON p.product_id = o.product_id\nWHERE p.category = 'Data';", "v": "vright", "result": {"cols": ["title", "order_id"], "rows": [["Data Made Simple", "101"], ["SQL in Pictures", "104"], ["Data Made Simple", "105"], ["SQL in Pictures", "107"], ["Data Made Simple", "110"], ["Graph Theory Gently", "NULL"]], "total": 6}}, {"name": "FULL JOIN", "task": "Everything from both sides, matched where possible.", "sql": "SELECT a.k AS a_key, b.k AS b_key\nFROM (VALUES (1), (2), (3)) AS a(k)\nFULL JOIN (VALUES (2), (3), (4)) AS b(k) ON a.k = b.k;", "v": "vfull", "result": {"cols": ["a_key", "b_key"], "rows": [["1", "NULL"], ["2", "2"], ["3", "3"], ["NULL", "4"]], "total": 4}}, {"name": "CROSS JOIN", "task": "Every city paired with every category.", "sql": "SELECT DISTINCT c.city, p.category\nFROM customers c\nCROSS JOIN products p\nORDER BY 1, 2\nLIMIT 6;", "v": "cross", "note": "3 cities × 3 categories = 9 combinations.", "result": {"cols": ["city", "category"], "rows": [["Austin", "Data"], ["Austin", "Fiction"], ["Austin", "Kids"], ["Leeds", "Data"], ["Leeds", "Fiction"], ["Leeds", "Kids"]], "total": 6}}]}, {"title": "Special joins", "items": [{"name": "Self join", "task": "Who referred whom? Join customers to itself.", "sql": "SELECT c.name, r.name AS referred_by\nFROM customers c\nJOIN customers r ON r.customer_id = c.referred_by;", "v": "self", "result": {"cols": ["name", "referred_by"], "rows": [["Ben", "Asha"], ["Chen", "Asha"], ["Dee", "Ben"], ["Fay", "Dee"]], "total": 4}}, {"name": "Anti-join", "task": "Customers who have never placed an order.", "sql": "SELECT c.name\nFROM customers c\nWHERE NOT EXISTS (\n  SELECT 1 FROM orders o WHERE o.customer_id = c.customer_id\n);", "v": "vanti", "result": {"cols": ["name"], "rows": [["Fay"]], "total": 1}}, {"name": "Semi-join", "task": "Products that were sold at least once, listed once each.", "sql": "SELECT p.title\nFROM products p\nWHERE EXISTS (\n  SELECT 1 FROM orders o WHERE o.product_id = p.product_id\n)\nORDER BY p.title;", "v": "vinner", "result": {"cols": ["title"], "rows": [["Data Made Simple"], ["Moon Bears"], ["Quiet Rivers"], ["SQL in Pictures"], ["The Night Library"]], "total": 5}}, {"name": "Joining three tables", "task": "Who bought what?", "sql": "SELECT o.order_id, c.name, p.title\nFROM orders o\nJOIN customers c ON c.customer_id = o.customer_id\nJOIN products  p ON p.product_id  = o.product_id\nORDER BY o.order_id\nLIMIT 5;", "v": "three", "result": {"cols": ["order_id", "name", "title"], "rows": [["101", "Asha", "Data Made Simple"], ["102", "Ben", "The Night Library"], ["103", "Asha", "Moon Bears"], ["104", "Chen", "SQL in Pictures"], ["105", "Dee", "Data Made Simple"]], "total": 5}}, {"name": "Non-equi join", "task": "Put each order into a price band defined as ranges.", "sql": "SELECT o.order_id, o.amount, b.band\nFROM orders o\nJOIN (VALUES ('small', 0, 20), ('medium', 20, 35), ('large', 35, 999))\n     AS b(band, lo, hi)\n  ON o.amount >= b.lo AND o.amount < b.hi\nORDER BY o.amount\nLIMIT 5;", "v": "between", "result": {"cols": ["order_id", "amount", "band"], "rows": [["106", "15.00", "small"], ["108", "18.00", "small"], ["109", "24.00", "medium"], ["104", "27.50", "medium"], ["110", "32.00", "medium"]], "total": 5}}, {"name": "USING", "task": "When both tables share the column name, USING shortens the ON clause.", "sql": "SELECT order_id, name\nFROM orders\nJOIN customers USING (customer_id)\nORDER BY order_id\nLIMIT 3;", "v": "vinner", "result": {"cols": ["order_id", "name"], "rows": [["101", "Asha"], ["102", "Ben"], ["103", "Asha"]], "total": 3}}]}, {"title": "Getting it right", "items": [{"name": "Filter in ON vs WHERE", "task": "Every customer with their 2024-03 orders. The date filter goes in ON.", "sql": "SELECT c.name, o.order_id\nFROM customers c\nLEFT JOIN orders o\n  ON o.customer_id = c.customer_id\n AND o.order_date >= '2024-03-01' AND o.order_date < '2024-04-01'\nORDER BY c.customer_id;", "v": "onwhere", "note": "Move the date filter to WHERE and customers without March orders disappear.", "result": {"cols": ["name", "order_id"], "rows": [["Asha", "108"], ["Ben", "106"], ["Chen", "NULL"], ["Dee", "NULL"], ["Eli", "107"], ["Fay", "NULL"]], "total": 6}}, {"name": "Fan-out", "task": "A one-to-many join repeats the 'one' side: Asha appears once per order.", "sql": "SELECT c.name, COUNT(*) AS rows_after_join\nFROM customers c\nJOIN orders o ON o.customer_id = c.customer_id\nGROUP BY c.name\nORDER BY rows_after_join DESC;", "v": "fanout", "result": {"cols": ["name", "rows_after_join"], "rows": [["Asha", "3"], ["Chen", "2"], ["Dee", "2"], ["Ben", "2"], ["Eli", "1"]], "total": 5}}, {"name": "Aggregate after a LEFT JOIN", "task": "Revenue per customer, showing 0 for customers with no orders.", "sql": "SELECT c.name, COUNT(o.order_id) AS orders,\n       COALESCE(SUM(o.amount), 0) AS revenue\nFROM customers c\nLEFT JOIN orders o ON o.customer_id = c.customer_id\nGROUP BY c.name\nORDER BY revenue DESC;", "v": "leftagg", "result": {"cols": ["name", "orders", "revenue"], "rows": [["Asha", "3", "86.00"], ["Chen", "2", "59.50"], ["Dee", "2", "56.00"], ["Eli", "1", "55.00"], ["Ben", "2", "51.00"], ["Fay", "0", "0"]], "total": 6}}]}]}, {"id": "aggregates", "title": "Aggregate Functions", "short": "Aggregates", "level": "Intermediate", "blurb": "Collapse many rows into one value per group, and know exactly how NULLs are treated.", "sections": [{"title": "The functions", "items": [{"name": "COUNT", "task": "Rows, non-NULL emails and distinct cities.", "sql": "SELECT COUNT(*)             AS customers,\n       COUNT(email)         AS with_email,\n       COUNT(DISTINCT city) AS cities\nFROM customers;", "v": "count", "result": {"cols": ["customers", "with_email", "cities"], "rows": [["6", "5", "3"]], "total": 1}}, {"name": "SUM and AVG", "task": "Total and average order value.", "sql": "SELECT SUM(amount) AS revenue,\n       ROUND(AVG(amount), 2) AS avg_order\nFROM orders;", "v": "sumavg", "result": {"cols": ["revenue", "avg_order"], "rows": [["307.50", "30.75"]], "total": 1}}, {"name": "MIN and MAX", "task": "First and latest order dates, and the price range.", "sql": "SELECT MIN(order_date)::date AS first_order,\n       MAX(order_date)::date AS last_order\nFROM orders;", "v": "minmax", "result": {"cols": ["first_order", "last_order"], "rows": [["2024-01-06", "2024-04-05"]], "total": 1}}, {"name": "STRING_AGG", "task": "All titles bought by each customer, in one string.", "sql": "SELECT c.name,\n       STRING_AGG(p.title, ', ' ORDER BY p.title) AS bought\nFROM orders o\nJOIN customers c USING (customer_id)\nJOIN products  p USING (product_id)\nGROUP BY c.name\nORDER BY c.name\nLIMIT 3;", "v": "stringagg", "result": {"cols": ["name", "bought"], "rows": [["Asha", "Data Made Simple, Moon Bears, The Night Library"], ["Ben", "Quiet Rivers, The Night Library"], ["Chen", "Data Made Simple, SQL in Pictures"]], "total": 3}}, {"name": "ARRAY_AGG", "task": "Collect order ids per status into an array.", "sql": "SELECT status, ARRAY_AGG(order_id ORDER BY order_id) AS orders\nFROM orders\nGROUP BY status;", "v": "stringagg", "io": [["paid orders", "{101,102,103,…}"], ["pending orders", "{109}"]], "result": {"cols": ["status", "orders"], "rows": [["paid", "{101,102,103,105,106,107,108,110}"], ["pending", "{109}"], ["refunded", "{104}"]], "total": 3}}, {"name": "BOOL_AND / BOOL_OR", "task": "Did every order in a month get paid? Did any?", "sql": "SELECT DATE_TRUNC('month', order_date)::date AS month,\n       BOOL_AND(status = 'paid') AS all_paid,\n       BOOL_OR(status = 'paid')  AS any_paid\nFROM orders\nGROUP BY 1 ORDER BY 1;", "v": "filteragg", "io": [["Feb: paid, refunded, paid", "all false · any true"], ["Mar: paid, paid, paid", "all true · any true"]], "result": {"cols": ["month", "all_paid", "any_paid"], "rows": [["2024-01-01", "true", "true"], ["2024-02-01", "false", "true"], ["2024-03-01", "true", "true"], ["2024-04-01", "false", "true"]], "total": 4}}]}, {"title": "Grouping", "items": [{"name": "GROUP BY", "task": "Number of customers per city.", "sql": "SELECT city, COUNT(*) AS customers\nFROM customers\nGROUP BY city\nORDER BY customers DESC, city;", "v": "group", "result": {"cols": ["city", "customers"], "rows": [["Austin", "2"], ["Leeds", "2"], ["Pune", "2"]], "total": 3}}, {"name": "GROUP BY two columns", "task": "Revenue by category and status.", "sql": "SELECT p.category, o.status, SUM(o.amount) AS revenue\nFROM orders o\nJOIN products p USING (product_id)\nGROUP BY p.category, o.status\nORDER BY 1, 2;", "v": "group", "result": {"cols": ["category", "status", "revenue"], "rows": [["Data", "paid", "151.00"], ["Data", "refunded", "27.50"], ["Fiction", "paid", "69.00"], ["Kids", "paid", "36.00"], ["Kids", "pending", "24.00"]], "total": 5}}, {"name": "HAVING", "task": "Customers who spent more than 60 in total.", "sql": "SELECT customer_id, SUM(amount) AS spent\nFROM orders\nGROUP BY customer_id\nHAVING SUM(amount) > 60\nORDER BY spent DESC;", "v": "having", "result": {"cols": ["customer_id", "spent"], "rows": [["1", "86.00"]], "total": 1}}, {"name": "WHERE + GROUP BY + HAVING", "task": "Paid revenue per customer, keeping customers above 50.", "sql": "SELECT customer_id, SUM(amount) AS paid_revenue\nFROM orders\nWHERE status = 'paid'\nGROUP BY customer_id\nHAVING SUM(amount) > 50\nORDER BY paid_revenue DESC;", "v": "having", "note": "WHERE filters rows first, GROUP BY groups them, HAVING filters the groups.", "result": {"cols": ["customer_id", "paid_revenue"], "rows": [["1", "86.00"], ["5", "55.00"], ["2", "51.00"]], "total": 3}}, {"name": "FILTER (WHERE ...)", "task": "Paid, refunded and pending counts in one pass.", "sql": "SELECT COUNT(*) FILTER (WHERE status = 'paid')     AS paid,\n       COUNT(*) FILTER (WHERE status = 'refunded') AS refunded,\n       COUNT(*) FILTER (WHERE status = 'pending')  AS pending\nFROM orders;", "v": "filteragg", "result": {"cols": ["paid", "refunded", "pending"], "rows": [["8", "1", "1"]], "total": 1}}]}, {"title": "Subtotals", "items": [{"name": "ROLLUP", "task": "Revenue per category with a grand total row.", "sql": "SELECT COALESCE(p.category, 'TOTAL') AS category,\n       SUM(o.amount) AS revenue\nFROM orders o\nJOIN products p USING (product_id)\nGROUP BY ROLLUP (p.category)\nORDER BY p.category NULLS LAST;", "v": "rollup", "result": {"cols": ["category", "revenue"], "rows": [["Data", "178.50"], ["Fiction", "69.00"], ["Kids", "60.00"], ["TOTAL", "307.50"]], "total": 4}}, {"name": "GROUPING SETS", "task": "Totals by city and by status, in one result.", "sql": "SELECT c.city, o.status, SUM(o.amount) AS revenue\nFROM orders o\nJOIN customers c USING (customer_id)\nGROUP BY GROUPING SETS ((c.city), (o.status))\nORDER BY c.city NULLS LAST, o.status;", "v": "rollup", "result": {"cols": ["city", "status", "revenue"], "rows": [["Austin", "NULL", "56.00"], ["Leeds", "NULL", "106.00"], ["Pune", "NULL", "145.50"], ["NULL", "paid", "256.00"], ["NULL", "pending", "24.00"], ["NULL", "refunded", "27.50"]], "total": 6}}, {"name": "CUBE", "task": "Every combination of category and status, plus all subtotals.", "sql": "SELECT p.category, o.status, COUNT(*) AS orders\nFROM orders o\nJOIN products p USING (product_id)\nWHERE o.status <> 'pending'\nGROUP BY CUBE (p.category, o.status)\nORDER BY 1 NULLS LAST, 2 NULLS LAST\nLIMIT 6;", "v": "rollup", "result": {"cols": ["category", "status", "orders"], "rows": [["Data", "paid", "4"], ["Data", "refunded", "1"], ["Data", "NULL", "5"], ["Fiction", "paid", "3"], ["Fiction", "NULL", "3"], ["Kids", "paid", "1"]], "total": 6}}]}, {"title": "NULL rules", "items": [{"name": "Aggregates skip NULL", "task": "AVG ignores the NULL: (10 + 20) / 2 = 15, not 10.", "sql": "SELECT AVG(x) AS avg_x, COUNT(x) AS counted, COUNT(*) AS rows\nFROM (VALUES (10), (NULL), (20)) AS t(x);", "v": "nullagg", "result": {"cols": ["avg_x", "counted", "rows"], "rows": [["15.0000000000000000", "2", "3"]], "total": 1}}, {"name": "SUM of nothing is NULL", "task": "SUM over zero rows returns NULL. COALESCE turns it into 0.", "sql": "SELECT SUM(amount) AS raw_sum,\n       COALESCE(SUM(amount), 0) AS safe_sum\nFROM orders\nWHERE status = 'cancelled';", "v": "coalesce", "result": {"cols": ["raw_sum", "safe_sum"], "rows": [["NULL", "0"]], "total": 1}}]}]}, {"id": "functions", "title": "Standard SQL Functions", "short": "Functions", "level": "Intermediate", "blurb": "Text, numbers, NULL handling, dates and CASE, with the traps written next to each one.", "sections": [{"title": "Text", "items": [{"name": "LENGTH / UPPER / LOWER / INITCAP", "task": "Measure and change case.", "sql": "SELECT LENGTH('Data Made Simple') AS len,\n       UPPER('sql')   AS up,\n       LOWER('SQL')   AS low,\n       INITCAP('the night library') AS title_case;", "v": "text1", "io": [["LENGTH('Data Made Simple')", "16"], ["UPPER('sql')", "SQL"], ["INITCAP('the night library')", "The Night Library"]], "result": {"cols": ["len", "up", "low", "title_case"], "rows": [["16", "SQL", "sql", "The Night Library"]], "total": 1}}, {"name": "TRIM", "task": "Remove spaces, or any characters you list.", "sql": "SELECT TRIM('  hi  ')            AS trimmed,\n       TRIM(BOTH '-' FROM '--x--') AS dashes_gone;", "v": "trim", "io": [["'  hi  '", "'hi'"], ["'--x--'", "'x'"]], "result": {"cols": ["trimmed", "dashes_gone"], "rows": [["hi", "x"]], "total": 1}}, {"name": "SUBSTRING / LEFT / RIGHT", "task": "Cut out parts of a string. Positions start at 1.", "sql": "SELECT SUBSTRING('2024-05-09' FROM 6 FOR 2) AS month,\n       LEFT('Pune', 2)  AS first_two,\n       RIGHT('Pune', 2) AS last_two;", "v": "trim", "io": [["'2024-05-09' from 6 for 2", "'05'"], ["LEFT('Pune', 2)", "'Pu'"], ["RIGHT('Pune', 2)", "'ne'"]], "result": {"cols": ["month", "first_two", "last_two"], "rows": [["05", "Pu", "ne"]], "total": 1}}, {"name": "|| vs CONCAT", "task": "|| returns NULL if any part is NULL; CONCAT treats NULL as empty.", "sql": "SELECT 'Hi ' || NULL       AS with_pipes,\n       CONCAT('Hi ', NULL) AS with_concat;", "v": "concat", "io": [["'Hi ' || NULL", "NULL"], ["CONCAT('Hi ', NULL)", "'Hi '"]], "result": {"cols": ["with_pipes", "with_concat"], "rows": [["NULL", "Hi "]], "total": 1}}, {"name": "POSITION / REPLACE", "task": "Find where a character is and swap substrings.", "sql": "SELECT email,\n       POSITION('@' IN email) AS at_sign,\n       REPLACE(email, '@mail.com', '') AS username\nFROM customers\nWHERE email IS NOT NULL\nLIMIT 3;", "v": "replace", "io": [["POSITION('@' IN 'asha@mail.com')", "5"], ["REPLACE(email, '@mail.com', '')", "'asha'"]], "result": {"cols": ["email", "at_sign", "username"], "rows": [["asha@mail.com", "5", "asha"], ["ben@mail.com", "4", "ben"], ["dee@mail.com", "4", "dee"]], "total": 3}}, {"name": "SPLIT_PART", "task": "Take the domain from an email.", "sql": "SELECT SPLIT_PART('asha@mail.com', '@', 2) AS domain,\n       SPLIT_PART('Ada Lovelace', ' ', 1)  AS first_name;", "v": "replace", "io": [["'asha@mail.com', '@', 2", "'mail.com'"], ["'Ada Lovelace', ' ', 1", "'Ada'"]], "result": {"cols": ["domain", "first_name"], "rows": [["mail.com", "Ada"]], "total": 1}}, {"name": "LPAD / RPAD", "task": "Pad ids to a fixed width.", "sql": "SELECT LPAD(order_id::text, 6, '0') AS padded\nFROM orders\nLIMIT 3;", "v": "text1", "io": [["LPAD('101', 6, '0')", "'000101'"]], "result": {"cols": ["padded"], "rows": [["000101"], ["000102"], ["000103"]], "total": 3}}]}, {"title": "Numbers", "items": [{"name": "ROUND / CEIL / FLOOR / TRUNC", "task": "Round to places, or up, down and toward zero.", "sql": "SELECT ROUND(3.14159, 2) AS round2,\n       CEIL(4.1)  AS ceil,\n       FLOOR(4.9) AS floor,\n       TRUNC(-4.7) AS trunc;", "v": "round", "io": [["ROUND(3.14159, 2)", "3.14"], ["CEIL(4.1)  FLOOR(4.9)", "5  4"], ["TRUNC(-4.7)", "-4"]], "result": {"cols": ["round2", "ceil", "floor", "trunc"], "rows": [["3.14", "5", "4", "-4"]], "total": 1}}, {"name": "Integer division", "task": "int / int drops the fraction. Make one side numeric.", "sql": "SELECT 7 / 2           AS int_div,\n       7 / 2.0         AS decimal_div,\n       7::numeric / 2  AS cast_div;", "v": "intdiv", "io": [["7 / 2", "3"], ["7 / 2.0", "3.5"]], "result": {"cols": ["int_div", "decimal_div", "cast_div"], "rows": [["3", "3.5000000000000000", "3.5000000000000000"]], "total": 1}}, {"name": "MOD / ABS / POWER / SQRT", "task": "Remainders, absolute values and powers.", "sql": "SELECT 17 % 5       AS mod,\n       ABS(-5)      AS abs,\n       POWER(2, 10) AS power,\n       SQRT(144)    AS sqrt;", "v": "absmod", "io": [["17 % 5", "2"], ["POWER(2, 10)", "1024"], ["SQRT(144)", "12"]], "result": {"cols": ["mod", "abs", "power", "sqrt"], "rows": [["2", "5", "1024", "12"]], "total": 1}}, {"name": "CAST", "task": "Convert types explicitly.", "sql": "SELECT CAST('42' AS int) + 1  AS number,\n       '2024-01-31'::date + 1 AS next_day;", "v": "cast", "io": [["CAST('42' AS int) + 1", "43"], ["'2024-01-31'::date + 1", "2024-02-01"]], "result": {"cols": ["number", "next_day"], "rows": [["43", "2024-02-01"]], "total": 1}}]}, {"title": "NULL handling", "items": [{"name": "COALESCE", "task": "Show 'no email' instead of NULL.", "sql": "SELECT name, COALESCE(email, 'no email') AS email\nFROM customers\nWHERE customer_id IN (2, 3);", "v": "coalesce", "result": {"cols": ["name", "email"], "rows": [["Ben", "ben@mail.com"], ["Chen", "no email"]], "total": 2}}, {"name": "NULLIF", "task": "Avoid divide-by-zero: x / 0 errors, x / NULL is NULL.", "sql": "SELECT sku, qty,\n       ROUND(100.0 / NULLIF(qty, 0), 1) AS pct_per_unit\nFROM stock;", "v": "nullif", "io": [["100.0 / 5", "20.0"], ["100.0 / NULLIF(0, 0)", "NULL"]], "result": {"cols": ["sku", "qty", "pct_per_unit"], "rows": [["A1", "5", "20.0"], ["B2", "0", "NULL"]], "total": 2}}]}, {"title": "Dates and times", "items": [{"name": "CURRENT_DATE / now()", "task": "Today's date and the current timestamp (results change every day).", "sql": "SELECT CURRENT_DATE, now();", "v": "now", "result": {"cols": ["current_date", "now"], "rows": [["2024-05-09", "2024-05-09 10:42:07.31+05:30"]], "total": null, "static": true}}, {"name": "EXTRACT", "task": "Pull parts out of a timestamp. DOW: 0 is Sunday.", "sql": "SELECT order_id,\n       EXTRACT(YEAR  FROM order_date) AS year,\n       EXTRACT(MONTH FROM order_date) AS month,\n       EXTRACT(DOW   FROM order_date) AS weekday\nFROM orders\nLIMIT 3;", "v": "extract", "result": {"cols": ["order_id", "year", "month", "weekday"], "rows": [["101", "2024", "1", "6"], ["102", "2024", "1", "0"], ["103", "2024", "2", "6"]], "total": 3}}, {"name": "DATE_TRUNC", "task": "Round timestamps down to the start of the month.", "sql": "SELECT order_date,\n       DATE_TRUNC('month', order_date) AS month\nFROM orders\nLIMIT 3;", "v": "trunc", "result": {"cols": ["order_date", "month"], "rows": [["2024-01-06 10:15:00", "2024-01-01 00:00:00"], ["2024-01-21 14:02:00", "2024-01-01 00:00:00"], ["2024-02-03 09:40:00", "2024-02-01 00:00:00"]], "total": 3}}, {"name": "Date arithmetic", "task": "Days between dates, and adding an interval.", "sql": "SELECT DATE '2024-03-30' - DATE '2024-01-05' AS days_between,\n       DATE '2024-01-31' + INTERVAL '1 month'   AS plus_month;", "v": "interval", "io": [["'2024-03-30' - '2024-01-05'", "85"], ["'2024-01-31' + 1 month", "2024-02-29"]], "result": {"cols": ["days_between", "plus_month"], "rows": [["85", "2024-02-29 00:00:00"]], "total": 1}}, {"name": "AGE", "task": "A human-readable difference between two dates.", "sql": "SELECT name, AGE(DATE '2024-04-30', signup_date) AS member_for\nFROM customers\nLIMIT 3;", "v": "interval", "io": [["AGE('2024-04-30', '2024-01-05')", "3 mons 25 days"]], "result": {"cols": ["name", "member_for"], "rows": [["Asha", "3 mons 25 days"], ["Ben", "3 mons 10 days"], ["Chen", "2 mons 19 days"]], "total": 3}}, {"name": "TO_CHAR", "task": "Format a timestamp for display.", "sql": "SELECT TO_CHAR(order_date, 'Dy DD Mon YYYY, HH24:MI') AS pretty\nFROM orders\nLIMIT 3;", "v": "now", "io": [["2024-01-06 10:15", "Sat 06 Jan 2024, 10:15"]], "result": {"cols": ["pretty"], "rows": [["Sat 06 Jan 2024, 10:15"], ["Sun 21 Jan 2024, 14:02"], ["Sat 03 Feb 2024, 09:40"]], "total": 3}}]}, {"title": "Conditional logic", "items": [{"name": "Searched CASE", "task": "Bucket orders by size.", "sql": "SELECT order_id, amount,\n  CASE WHEN amount >= 35 THEN 'large'\n       WHEN amount >= 20 THEN 'medium'\n       ELSE 'small' END AS size\nFROM orders\nORDER BY amount\nLIMIT 5;", "v": "case", "result": {"cols": ["order_id", "amount", "size"], "rows": [["106", "15.00", "small"], ["108", "18.00", "small"], ["109", "24.00", "medium"], ["104", "27.50", "medium"], ["110", "32.00", "medium"]], "total": 5}}, {"name": "Simple CASE", "task": "Translate status codes into labels.", "sql": "SELECT order_id,\n  CASE status WHEN 'paid' THEN 'Done'\n              WHEN 'pending' THEN 'Waiting'\n              ELSE 'Check' END AS label\nFROM orders\nWHERE order_id IN (103, 104, 109);", "v": "case", "result": {"cols": ["order_id", "label"], "rows": [["103", "Done"], ["104", "Check"], ["109", "Waiting"]], "total": 3}}, {"name": "GREATEST / LEAST", "task": "Largest and smallest of several values in one row.", "sql": "SELECT GREATEST(12, 40, 27) AS biggest,\n       LEAST(12, 40, 27)    AS smallest;", "v": "greatest", "io": [["GREATEST(12, 40, 27)", "40"], ["LEAST(12, 40, 27)", "12"]], "result": {"cols": ["biggest", "smallest"], "rows": [["40", "12"]], "total": 1}}]}]}, {"id": "window", "title": "Window Functions", "short": "Window", "level": "Advanced", "blurb": "Calculate across related rows without collapsing them: rankings, running totals and comparisons.", "sections": [{"title": "Anatomy", "items": [{"name": "OVER ()", "task": "Show each salary next to the company average.", "sql": "SELECT name, salary,\n       ROUND(AVG(salary) OVER ()) AS company_avg\nFROM employees;", "v": "over", "result": {"cols": ["name", "salary", "company_avg"], "rows": [["Maya", "120000", "87833"], ["Omar", "95000", "87833"], ["Priya", "95000", "87833"], ["Liam", "70000", "87833"], ["Noor", "82000", "87833"], ["Raj", "65000", "87833"]], "total": 6}}, {"name": "PARTITION BY", "task": "Average salary per department, on every row.", "sql": "SELECT name, dept, salary,\n       ROUND(AVG(salary) OVER (PARTITION BY dept)) AS dept_avg\nFROM employees;", "v": "over", "result": {"cols": ["name", "dept", "salary", "dept_avg"], "rows": [["Maya", "Eng", "120000", "103333"], ["Omar", "Eng", "95000", "103333"], ["Priya", "Eng", "95000", "103333"], ["Liam", "Sales", "70000", "72333"], ["Noor", "Sales", "82000", "72333"], ["Raj", "Sales", "65000", "72333"]], "total": 6}}, {"name": "Named window", "task": "Define a window once and reuse it.", "sql": "SELECT name, dept, salary,\n       RANK() OVER w AS rnk,\n       MAX(salary) OVER w AS dept_max\nFROM employees\nWINDOW w AS (PARTITION BY dept ORDER BY salary DESC);", "v": "named", "result": {"cols": ["name", "dept", "salary", "rnk", "dept_max"], "rows": [["Maya", "Eng", "120000", "1", "120000"], ["Omar", "Eng", "95000", "2", "120000"], ["Priya", "Eng", "95000", "2", "120000"], ["Noor", "Sales", "82000", "1", "82000"], ["Liam", "Sales", "70000", "2", "82000"], ["Raj", "Sales", "65000", "3", "82000"]], "total": 6}}]}, {"title": "Ranking", "items": [{"name": "ROW_NUMBER / RANK / DENSE_RANK", "task": "They differ only on ties (Omar and Priya both earn 95,000).", "sql": "SELECT name, salary,\n  ROW_NUMBER() OVER (ORDER BY salary DESC) AS row_num,\n  RANK()       OVER (ORDER BY salary DESC) AS rnk,\n  DENSE_RANK() OVER (ORDER BY salary DESC) AS dense\nFROM employees;", "v": "rank", "result": {"cols": ["name", "salary", "row_num", "rnk", "dense"], "rows": [["Maya", "120000", "1", "1", "1"], ["Omar", "95000", "2", "2", "2"], ["Priya", "95000", "3", "2", "2"], ["Noor", "82000", "4", "4", "3"], ["Liam", "70000", "5", "5", "4"], ["Raj", "65000", "6", "6", "5"]], "total": 6}}, {"name": "NTILE", "task": "Split employees into salary halves.", "sql": "SELECT name, salary,\n       NTILE(2) OVER (ORDER BY salary DESC) AS half\nFROM employees;", "v": "ntile", "result": {"cols": ["name", "salary", "half"], "rows": [["Maya", "120000", "1"], ["Omar", "95000", "1"], ["Priya", "95000", "1"], ["Noor", "82000", "2"], ["Liam", "70000", "2"], ["Raj", "65000", "2"]], "total": 6}}, {"name": "PERCENT_RANK", "task": "Relative standing from 0 to 1.", "sql": "SELECT name, salary,\n       ROUND(PERCENT_RANK() OVER (ORDER BY salary)::numeric, 2) AS pct_rank\nFROM employees;", "v": "rank", "result": {"cols": ["name", "salary", "pct_rank"], "rows": [["Raj", "65000", "0.00"], ["Liam", "70000", "0.20"], ["Noor", "82000", "0.40"], ["Omar", "95000", "0.60"], ["Priya", "95000", "0.60"], ["Maya", "120000", "1.00"]], "total": 6}}, {"name": "Top N per group", "task": "Highest-paid person in each department.", "sql": "WITH ranked AS (\n  SELECT name, dept, salary,\n         ROW_NUMBER() OVER (PARTITION BY dept ORDER BY salary DESC) AS rn\n  FROM employees\n)\nSELECT name, dept, salary\nFROM ranked\nWHERE rn = 1;", "v": "topn", "result": {"cols": ["name", "dept", "salary"], "rows": [["Maya", "Eng", "120000"], ["Noor", "Sales", "82000"]], "total": 2}}]}, {"title": "Offsets", "items": [{"name": "LAG / LEAD", "task": "Each order next to the customer's previous order amount.", "sql": "SELECT customer_id, order_id, amount,\n       LAG(amount) OVER (PARTITION BY customer_id ORDER BY order_date) AS prev_amount\nFROM orders\nWHERE customer_id IN (1, 2);", "v": "lag", "result": {"cols": ["customer_id", "order_id", "amount", "prev_amount"], "rows": [["1", "101", "32.00", "NULL"], ["1", "103", "36.00", "32.00"], ["1", "108", "18.00", "36.00"], ["2", "102", "36.00", "NULL"], ["2", "106", "15.00", "36.00"]], "total": 5}}, {"name": "FIRST_VALUE / LAST_VALUE", "task": "Cheapest and priciest product per category. LAST_VALUE needs a full frame.", "sql": "SELECT title, category, price,\n  FIRST_VALUE(title) OVER w AS cheapest,\n  LAST_VALUE(title)  OVER w AS priciest\nFROM products\nWINDOW w AS (PARTITION BY category ORDER BY price\n             ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING);", "v": "lastvalue", "result": {"cols": ["title", "category", "price", "cheapest", "priciest"], "rows": [["SQL in Pictures", "Data", "27.50", "SQL in Pictures", "Graph Theory Gently"], ["Data Made Simple", "Data", "32.00", "SQL in Pictures", "Graph Theory Gently"], ["Graph Theory Gently", "Data", "40.00", "SQL in Pictures", "Graph Theory Gently"], ["Quiet Rivers", "Fiction", "15.00", "Quiet Rivers", "The Night Library"], ["The Night Library", "Fiction", "18.00", "Quiet Rivers", "The Night Library"], ["Moon Bears", "Kids", "12.00", "Moon Bears", "Moon Bears"]], "total": 6}}]}, {"title": "Running maths", "items": [{"name": "Running total", "task": "Cumulative revenue by order date.", "sql": "SELECT order_id, order_date::date AS day, amount,\n       SUM(amount) OVER (ORDER BY order_date\n                         ROWS UNBOUNDED PRECEDING) AS running_total\nFROM orders\nLIMIT 5;", "v": "running", "result": {"cols": ["order_id", "day", "amount", "running_total"], "rows": [["101", "2024-01-06", "32.00", "32.00"], ["102", "2024-01-21", "36.00", "68.00"], ["103", "2024-02-03", "36.00", "104.00"], ["104", "2024-02-12", "27.50", "131.50"], ["105", "2024-02-29", "32.00", "163.50"]], "total": 5}}, {"name": "Moving average", "task": "Average of each order and the 2 before it.", "sql": "SELECT order_id, amount,\n       ROUND(AVG(amount) OVER (ORDER BY order_date\n             ROWS BETWEEN 2 PRECEDING AND CURRENT ROW), 2) AS avg_3\nFROM orders\nLIMIT 5;", "v": "moving", "result": {"cols": ["order_id", "amount", "avg_3"], "rows": [["101", "32.00", "32.00"], ["102", "36.00", "34.00"], ["103", "36.00", "34.67"], ["104", "27.50", "33.17"], ["105", "32.00", "31.83"]], "total": 5}}, {"name": "Share of total", "task": "Each department's share of the payroll.", "sql": "SELECT dept, SUM(salary) AS payroll,\n       ROUND(100.0 * SUM(salary) / SUM(SUM(salary)) OVER (), 1) AS pct\nFROM employees\nGROUP BY dept;", "v": "share", "result": {"cols": ["dept", "payroll", "pct"], "rows": [["Eng", "310000", "58.8"], ["Sales", "217000", "41.2"]], "total": 2}}, {"name": "ROWS vs RANGE", "task": "With ties in ORDER BY, RANGE gives tied rows the same running total.", "sql": "SELECT name, salary,\n  SUM(salary) OVER (ORDER BY salary ROWS  UNBOUNDED PRECEDING) AS rows_total,\n  SUM(salary) OVER (ORDER BY salary RANGE UNBOUNDED PRECEDING) AS range_total\nFROM employees\nWHERE dept = 'Eng';", "v": "rowsrange", "note": "The default frame with ORDER BY is RANGE. Write ROWS for a strict row-by-row total.", "result": {"cols": ["name", "salary", "rows_total", "range_total"], "rows": [["Omar", "95000", "95000", "190000"], ["Priya", "95000", "190000", "190000"], ["Maya", "120000", "310000", "310000"]], "total": 3}}]}, {"title": "Filtering results", "items": [{"name": "Window results in WHERE", "task": "WHERE runs before window functions, so this fails.", "sql": "SELECT name, RANK() OVER (ORDER BY salary DESC) AS rnk\nFROM employees\nWHERE rnk <= 2;", "v": "order", "result": {"error": "column \"rnk\" does not exist"}}, {"name": "Filter in an outer query", "task": "Rank inside a CTE, then filter outside.", "sql": "WITH r AS (\n  SELECT name, RANK() OVER (ORDER BY salary DESC) AS rnk\n  FROM employees\n)\nSELECT * FROM r WHERE rnk <= 2;", "v": "topn", "result": {"cols": ["name", "rnk"], "rows": [["Maya", "1"], ["Omar", "2"], ["Priya", "2"]], "total": 3}}]}]}, {"id": "analysis", "title": "SQL for Data Analysis", "short": "Data Analysis", "level": "Intermediate", "blurb": "Task-by-task recipes for the questions analysts answer every week, from first look to cohorts.", "sections": [{"title": "First look", "items": [{"name": "Profile a table", "task": "How complete is the customers table?", "sql": "SELECT COUNT(*)                  AS rows,\n       COUNT(*) - COUNT(email)   AS missing_email,\n       COUNT(DISTINCT city)      AS cities,\n       MIN(signup_date)          AS first_signup,\n       MAX(signup_date)          AS last_signup\nFROM customers;", "v": "profile", "result": {"cols": ["rows", "missing_email", "cities", "first_signup", "last_signup"], "rows": [["6", "1", "3", "2024-01-05", "2024-03-30"]], "total": 1}}, {"name": "Top rows", "task": "The 3 biggest orders.", "sql": "SELECT order_id, customer_id, amount\nFROM orders\nORDER BY amount DESC\nLIMIT 3;", "v": "limit", "result": {"cols": ["order_id", "customer_id", "amount"], "rows": [["107", "5", "55.00"], ["103", "1", "36.00"], ["102", "2", "36.00"]], "total": 3}}, {"name": "Value counts", "task": "How many orders per status, with percentages?", "sql": "SELECT status, COUNT(*) AS orders,\n       ROUND(100.0 * COUNT(*) / SUM(COUNT(*)) OVER (), 1) AS pct\nFROM orders\nGROUP BY status\nORDER BY orders DESC;", "v": "share", "result": {"cols": ["status", "orders", "pct"], "rows": [["paid", "8", "80.0"], ["pending", "1", "10.0"], ["refunded", "1", "10.0"]], "total": 3}}]}, {"title": "Computations", "items": [{"name": "Derived columns", "task": "Unit price paid on each order.", "sql": "SELECT order_id, qty, amount,\n       ROUND(amount / qty, 2) AS unit_price\nFROM orders\nWHERE qty > 1;", "v": "round", "result": {"cols": ["order_id", "qty", "amount", "unit_price"], "rows": [["102", "2", "36.00", "18.00"], ["103", "3", "36.00", "12.00"], ["107", "2", "55.00", "27.50"], ["109", "2", "24.00", "12.00"]], "total": 4}}, {"name": "Integer division trap", "task": "Share of paid orders: the first column is wrong.", "sql": "SELECT COUNT(*) FILTER (WHERE status = 'paid') / COUNT(*)       AS wrong,\n       ROUND(COUNT(*) FILTER (WHERE status = 'paid') * 1.0 / COUNT(*), 2) AS right_share\nFROM orders;", "v": "intdiv", "note": "int / int truncates to 0. Multiply by 1.0 or cast to numeric first.", "io": [["8 / 10 (int / int)", "0"], ["8 * 1.0 / 10", "0.80"]], "result": {"cols": ["wrong", "right_share"], "rows": [["0", "0.80"]], "total": 1}}, {"name": "Safe division", "task": "Revenue per unit in stock, without dividing by zero.", "sql": "SELECT sku, qty,\n       100 / NULLIF(qty, 0) AS per_unit\nFROM stock;", "v": "nullif", "io": [["100 / 5", "20"], ["100 / NULLIF(0, 0)", "NULL"]], "result": {"cols": ["sku", "qty", "per_unit"], "rows": [["A1", "5", "20"], ["B2", "0", "NULL"]], "total": 2}}]}, {"title": "Summarise", "items": [{"name": "Revenue by category", "task": "Paid revenue and order count per category.", "sql": "SELECT p.category, COUNT(*) AS orders, SUM(o.amount) AS revenue\nFROM orders o\nJOIN products p USING (product_id)\nWHERE o.status = 'paid'\nGROUP BY p.category\nORDER BY revenue DESC;", "v": "group", "result": {"cols": ["category", "orders", "revenue"], "rows": [["Data", "4", "151.00"], ["Fiction", "3", "69.00"], ["Kids", "1", "36.00"]], "total": 3}}, {"name": "Revenue by month", "task": "Monthly revenue with DATE_TRUNC.", "sql": "SELECT DATE_TRUNC('month', order_date)::date AS month,\n       COUNT(*) AS orders, SUM(amount) AS revenue\nFROM orders\nGROUP BY 1\nORDER BY 1;", "v": "monthly", "result": {"cols": ["month", "orders", "revenue"], "rows": [["2024-01-01", "2", "68.00"], ["2024-02-01", "3", "95.50"], ["2024-03-01", "3", "88.00"], ["2024-04-01", "2", "56.00"]], "total": 4}}, {"name": "CASE WHEN + GROUP BY", "task": "How many orders are small, medium or large?", "sql": "SELECT CASE WHEN amount >= 35 THEN 'large'\n            WHEN amount >= 20 THEN 'medium'\n            ELSE 'small' END AS size,\n       COUNT(*) AS orders\nFROM orders\nGROUP BY 1\nORDER BY orders DESC;", "v": "case", "result": {"cols": ["size", "orders"], "rows": [["medium", "5"], ["large", "3"], ["small", "2"]], "total": 3}}, {"name": "Pivot with FILTER", "task": "Monthly revenue split by city, one column per city.", "sql": "SELECT DATE_TRUNC('month', o.order_date)::date AS month,\n  SUM(o.amount) FILTER (WHERE c.city = 'Pune')   AS pune,\n  SUM(o.amount) FILTER (WHERE c.city = 'Leeds')  AS leeds,\n  SUM(o.amount) FILTER (WHERE c.city = 'Austin') AS austin\nFROM orders o JOIN customers c USING (customer_id)\nGROUP BY 1 ORDER BY 1;", "v": "pivot", "result": {"cols": ["month", "pune", "leeds", "austin"], "rows": [["2024-01-01", "32.00", "36.00", "NULL"], ["2024-02-01", "63.50", "NULL", "32.00"], ["2024-03-01", "18.00", "70.00", "NULL"], ["2024-04-01", "32.00", "NULL", "24.00"]], "total": 4}}, {"name": "Subtotals with ROLLUP", "task": "Revenue by city and status, with city subtotals.", "sql": "SELECT COALESCE(c.city, 'ALL') AS city,\n       COALESCE(o.status, 'all') AS status,\n       SUM(o.amount) AS revenue\nFROM orders o JOIN customers c USING (customer_id)\nWHERE c.city = 'Pune'\nGROUP BY ROLLUP (c.city, o.status)\nORDER BY c.city, o.status NULLS LAST;", "v": "rollup", "result": {"cols": ["city", "status", "revenue"], "rows": [["Pune", "paid", "118.00"], ["Pune", "refunded", "27.50"], ["Pune", "all", "145.50"], ["ALL", "all", "145.50"]], "total": 4}}]}, {"title": "Dates", "items": [{"name": "Half-open date range", "task": "All orders in February 2024, including the 29th.", "sql": "SELECT order_id, order_date\nFROM orders\nWHERE order_date >= '2024-02-01'\n  AND order_date <  '2024-03-01';", "v": "interval", "note": "BETWEEN '2024-02-01' AND '2024-02-29' would miss everything after midnight on the 29th.", "result": {"cols": ["order_id", "order_date"], "rows": [["103", "2024-02-03 09:40:00"], ["104", "2024-02-12 18:25:00"], ["105", "2024-02-29 11:00:00"]], "total": 3}}, {"name": "Day of week", "task": "Which weekdays get the most orders?", "sql": "SELECT TO_CHAR(order_date, 'Dy') AS weekday, COUNT(*) AS orders\nFROM orders\nGROUP BY 1, EXTRACT(ISODOW FROM order_date)\nORDER BY EXTRACT(ISODOW FROM order_date);", "v": "extract", "result": {"cols": ["weekday", "orders"], "rows": [["Mon", "1"], ["Tue", "1"], ["Wed", "1"], ["Thu", "1"], ["Fri", "1"], ["Sat", "4"], ["Sun", "1"]], "total": 7}}, {"name": "Time to first order", "task": "Days from signup to each customer's first order.", "sql": "SELECT c.name,\n       MIN(o.order_date)::date - c.signup_date AS days_to_first_order\nFROM customers c\nJOIN orders o USING (customer_id)\nGROUP BY c.name, c.signup_date\nORDER BY days_to_first_order;", "v": "interval", "result": {"cols": ["name", "days_to_first_order"], "rows": [["Ben", "1"], ["Asha", "1"], ["Eli", "1"], ["Chen", "1"], ["Dee", "1"]], "total": 5}}, {"name": "Fill missing days", "task": "Revenue for every day of a week, with 0 for empty days.", "sql": "SELECT d::date AS day, COALESCE(SUM(o.amount), 0) AS revenue\nFROM generate_series('2024-03-14'::date, '2024-03-20', '1 day') AS d\nLEFT JOIN orders o ON o.order_date::date = d::date\nGROUP BY 1\nORDER BY 1;", "v": "fillgaps", "result": {"cols": ["day", "revenue"], "rows": [["2024-03-14", "0"], ["2024-03-15", "0"], ["2024-03-16", "55.00"], ["2024-03-17", "0"], ["2024-03-18", "0"], ["2024-03-19", "0"], ["2024-03-20", "18.00"]], "total": 7}}]}, {"title": "Window analytics", "items": [{"name": "Rank customers", "task": "Customers ranked by total spend.", "sql": "SELECT customer_id, SUM(amount) AS spent,\n       RANK() OVER (ORDER BY SUM(amount) DESC) AS rnk\nFROM orders\nGROUP BY customer_id;", "v": "rank", "result": {"cols": ["customer_id", "spent", "rnk"], "rows": [["1", "86.00", "1"], ["3", "59.50", "2"], ["4", "56.00", "3"], ["5", "55.00", "4"], ["2", "51.00", "5"]], "total": 5}}, {"name": "Percent of total within a group", "task": "Each order's share of its customer's spend.", "sql": "SELECT customer_id, order_id, amount,\n       ROUND(100.0 * amount / SUM(amount) OVER (PARTITION BY customer_id), 1) AS pct_of_customer\nFROM orders\nWHERE customer_id = 1;", "v": "share", "result": {"cols": ["customer_id", "order_id", "amount", "pct_of_customer"], "rows": [["1", "101", "32.00", "37.2"], ["1", "103", "36.00", "41.9"], ["1", "108", "18.00", "20.9"]], "total": 3}}, {"name": "Running total by month", "task": "Cumulative revenue month by month.", "sql": "SELECT DATE_TRUNC('month', order_date)::date AS month,\n       SUM(amount) AS revenue,\n       SUM(SUM(amount)) OVER (ORDER BY DATE_TRUNC('month', order_date)::date) AS cumulative\nFROM orders\nGROUP BY 1\nORDER BY 1;", "v": "running", "result": {"cols": ["month", "revenue", "cumulative"], "rows": [["2024-01-01", "68.00", "68.00"], ["2024-02-01", "95.50", "163.50"], ["2024-03-01", "88.00", "251.50"], ["2024-04-01", "56.00", "307.50"]], "total": 4}}, {"name": "Month-over-month change", "task": "Revenue change versus the previous month.", "sql": "WITH m AS (\n  SELECT DATE_TRUNC('month', order_date)::date AS month, SUM(amount) AS revenue\n  FROM orders GROUP BY 1\n)\nSELECT month, revenue,\n       revenue - LAG(revenue) OVER (ORDER BY month) AS delta,\n       ROUND(100.0 * (revenue - LAG(revenue) OVER (ORDER BY month))\n             / LAG(revenue) OVER (ORDER BY month), 1) AS pct\nFROM m ORDER BY month;", "v": "growth", "result": {"cols": ["month", "revenue", "delta", "pct"], "rows": [["2024-01-01", "68.00", "NULL", "NULL"], ["2024-02-01", "95.50", "27.50", "40.4"], ["2024-03-01", "88.00", "-7.50", "-7.9"], ["2024-04-01", "56.00", "-32.00", "-36.4"]], "total": 4}}, {"name": "Moving average", "task": "3-order moving average of order value.", "sql": "SELECT order_id, amount,\n       ROUND(AVG(amount) OVER (ORDER BY order_date\n             ROWS BETWEEN 2 PRECEDING AND CURRENT ROW), 2) AS moving_avg\nFROM orders\nORDER BY order_date\nLIMIT 6;", "v": "moving", "result": {"cols": ["order_id", "amount", "moving_avg"], "rows": [["101", "32.00", "32.00"], ["102", "36.00", "34.00"], ["103", "36.00", "34.67"], ["104", "27.50", "33.17"], ["105", "32.00", "31.83"], ["106", "15.00", "24.83"]], "total": 6}}]}, {"title": "Distributions", "items": [{"name": "Median and percentiles", "task": "Median and 90th percentile order value.", "sql": "SELECT PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY amount) AS median,\n       ROUND((PERCENTILE_CONT(0.9) WITHIN GROUP (ORDER BY amount))::numeric, 2) AS p90,\n       ROUND(AVG(amount), 2) AS mean\nFROM orders;", "v": "percentile", "result": {"cols": ["median", "p90", "mean"], "rows": [["32", "37.90", "30.75"]], "total": 1}}, {"name": "Histogram", "task": "Orders per 10-unit amount bin.", "sql": "SELECT WIDTH_BUCKET(amount, 10, 60, 5) AS bin,\n       (10 + (WIDTH_BUCKET(amount, 10, 60, 5) - 1) * 10) || '-' ||\n       (20 + (WIDTH_BUCKET(amount, 10, 60, 5) - 1) * 10) AS range,\n       COUNT(*) AS orders\nFROM orders\nGROUP BY 1, 2 ORDER BY 1;", "v": "histogram", "result": {"cols": ["bin", "range", "orders"], "rows": [["1", "10-20", "2"], ["2", "20-30", "2"], ["3", "30-40", "5"], ["5", "50-60", "1"]], "total": 4}}]}, {"title": "Customers and CTEs", "items": [{"name": "Above-average spenders", "task": "Customers whose total spend beats the average customer.", "sql": "WITH spend AS (\n  SELECT customer_id, SUM(amount) AS total\n  FROM orders GROUP BY customer_id\n)\nSELECT customer_id, total\nFROM spend\nWHERE total > (SELECT AVG(total) FROM spend)\nORDER BY total DESC;", "v": "having", "result": {"cols": ["customer_id", "total"], "rows": [["1", "86.00"]], "total": 1}}, {"name": "Cohorts", "task": "New customers by first-order month.", "sql": "WITH firsts AS (\n  SELECT customer_id, DATE_TRUNC('month', MIN(order_date))::date AS cohort\n  FROM orders GROUP BY customer_id\n)\nSELECT cohort, COUNT(*) AS new_customers\nFROM firsts GROUP BY cohort ORDER BY cohort;", "v": "cohort", "result": {"cols": ["cohort", "new_customers"], "rows": [["2024-01-01", "2"], ["2024-02-01", "2"], ["2024-03-01", "1"]], "total": 3}}, {"name": "Repeat customers", "task": "Share of customers who ordered more than once.", "sql": "WITH per AS (\n  SELECT customer_id, COUNT(*) AS n FROM orders GROUP BY customer_id\n)\nSELECT COUNT(*) FILTER (WHERE n > 1) AS repeat_customers,\n       COUNT(*) AS buyers,\n       ROUND(100.0 * COUNT(*) FILTER (WHERE n > 1) / COUNT(*), 1) AS pct\nFROM per;", "v": "funnel", "result": {"cols": ["repeat_customers", "buyers", "pct"], "rows": [["4", "5", "80.0"]], "total": 1}}, {"name": "Latest order per customer", "task": "Keep one row per customer: their most recent order.", "sql": "WITH r AS (\n  SELECT customer_id, order_id, order_date,\n         ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY order_date DESC) AS rn\n  FROM orders\n)\nSELECT customer_id, order_id, order_date::date AS latest\nFROM r WHERE rn = 1;", "v": "dedupe", "result": {"cols": ["customer_id", "order_id", "latest"], "rows": [["1", "108", "2024-03-20"], ["2", "106", "2024-03-02"], ["3", "110", "2024-04-05"], ["4", "109", "2024-04-02"], ["5", "107", "2024-03-16"]], "total": 5}}]}]}, {"id": "postgres", "title": "PostgreSQL", "short": "PostgreSQL", "level": "Intermediate", "blurb": "psql commands, types and the Postgres-only features worth knowing by heart.", "sections": [{"title": "psql commands", "items": [{"name": "Connect and look around", "task": "List databases, connect, list tables and describe one.", "sql": "\\l              -- list databases\n\\c shop         -- connect to shop\n\\dt             -- list tables\n\\d orders       -- describe orders", "v": "psql", "result": {"cols": ["Schema", "Name", "Type"], "rows": [["public", "customers", "table"], ["public", "orders", "table"], ["public", "products", "table"]], "total": null, "static": true}}, {"name": "Comfort settings", "task": "Readable wide rows, query timing, help and quit.", "sql": "\\x auto         -- wide rows print vertically\n\\timing on      -- show how long each query takes\n\\?              -- list all psql commands\n\\q              -- quit", "v": "psql", "result": {"cols": ["output"], "rows": [["Expanded display is used automatically."], ["Timing is on."]], "total": null, "static": true}}, {"name": "Import and export", "task": "Copy a CSV between your machine and a table.", "sql": "\\copy orders TO 'orders.csv' CSV HEADER\n\\copy orders FROM 'orders.csv' CSV HEADER", "v": "psql", "result": {"cols": ["output"], "rows": [["COPY 10"]], "total": null, "static": true}}]}, {"title": "Types", "items": [{"name": "Identity columns", "task": "Let Postgres number new rows for you.", "sql": "CREATE TEMP TABLE tickets (\n  ticket_id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  subject   text\n);\nINSERT INTO tickets (subject) VALUES ('Login'), ('Refund'), ('Shipping')\nRETURNING *;", "v": "identity", "note": "Prefer GENERATED ... AS IDENTITY over SERIAL in new tables.", "result": {"cols": ["ticket_id", "subject"], "rows": [["1", "Login"], ["2", "Refund"], ["3", "Shipping"]], "total": 3}}, {"name": "JSONB", "task": "Read fields from JSON and filter by containment.", "sql": "SELECT event_id,\n       data->>'email'           AS email,\n       data->'address'->>'city' AS city\nFROM events\nWHERE data @> '{\"type\": \"signup\"}';", "v": "json", "result": {"cols": ["event_id", "email", "city"], "rows": [["1", "asha@mail.com", "Pune"], ["3", "dee@mail.com", "Austin"]], "total": 2}}, {"name": "Arrays", "task": "Find posts tagged sql, then unpack all tags.", "sql": "SELECT title, tags\nFROM posts\nWHERE 'sql' = ANY (tags);", "v": "array", "result": {"cols": ["title", "tags"], "rows": [["Joins explained", "{sql,joins}"], ["Window magic", "{sql,window}"]], "total": 2}}, {"name": "unnest", "task": "Turn an array into rows, then count tags.", "sql": "SELECT tag, COUNT(*) AS posts\nFROM posts, unnest(tags) AS tag\nGROUP BY tag\nORDER BY posts DESC, tag;", "v": "array", "io": [["{sql,joins}", "sql | joins"], ["{sql,window}", "sql | window"]], "result": {"cols": ["tag", "posts"], "rows": [["sql", "2"], ["joins", "1"], ["python", "1"], ["window", "1"]], "total": 4}}]}, {"title": "Postgres superpowers", "items": [{"name": "ON CONFLICT (upsert)", "task": "Add stock, or increase it if the SKU already exists.", "sql": "INSERT INTO stock (sku, qty) VALUES ('A1', 3), ('C3', 7)\nON CONFLICT (sku) DO UPDATE SET qty = stock.qty + EXCLUDED.qty\nRETURNING *;", "v": "upsert", "result": {"cols": ["sku", "qty"], "rows": [["A1", "8"], ["C3", "7"]], "total": 2}}, {"name": "RETURNING", "task": "Get the changed rows back from an UPDATE.", "sql": "UPDATE orders SET status = 'shipped'\nWHERE status = 'pending'\nRETURNING order_id, status;", "v": "returning", "result": {"cols": ["order_id", "status"], "rows": [["109", "shipped"]], "total": 1}}, {"name": "DISTINCT ON", "task": "Latest order per customer without a window function.", "sql": "SELECT DISTINCT ON (customer_id)\n       customer_id, order_id, order_date::date AS latest\nFROM orders\nORDER BY customer_id, order_date DESC;", "v": "distincton", "result": {"cols": ["customer_id", "order_id", "latest"], "rows": [["1", "108", "2024-03-20"], ["2", "106", "2024-03-02"], ["3", "110", "2024-04-05"], ["4", "109", "2024-04-02"], ["5", "107", "2024-03-16"]], "total": 5}}, {"name": "LATERAL", "task": "The priciest product in each category, via a correlated subquery in FROM.", "sql": "SELECT cat.category, top.title, top.price\nFROM (SELECT DISTINCT category FROM products) cat\nCROSS JOIN LATERAL (\n  SELECT title, price FROM products p\n  WHERE p.category = cat.category\n  ORDER BY price DESC LIMIT 1\n) top\nORDER BY cat.category;", "v": "topn", "result": {"cols": ["category", "title", "price"], "rows": [["Data", "Graph Theory Gently", "40.00"], ["Fiction", "The Night Library", "18.00"], ["Kids", "Moon Bears", "12.00"]], "total": 3}}, {"name": "generate_series", "task": "Make number or date sequences on the fly.", "sql": "SELECT n, n * n AS square\nFROM generate_series(1, 5) AS n;", "v": "series", "io": [["generate_series(1, 5)", "1, 2, 3, 4, 5"], ["n * n", "1, 4, 9, 16, 25"]], "result": {"cols": ["n", "square"], "rows": [["1", "1"], ["2", "4"], ["3", "9"], ["4", "16"], ["5", "25"]], "total": 5}}, {"name": "WITH RECURSIVE", "task": "Walk up the management chain from Raj.", "sql": "WITH RECURSIVE chain AS (\n  SELECT employee_id, name, manager_id, 1 AS level\n  FROM employees WHERE name = 'Raj'\n  UNION ALL\n  SELECT e.employee_id, e.name, e.manager_id, c.level + 1\n  FROM employees e JOIN chain c ON e.employee_id = c.manager_id\n)\nSELECT level, name FROM chain;", "v": "recursive", "result": {"cols": ["level", "name"], "rows": [["1", "Raj"], ["2", "Liam"], ["3", "Maya"]], "total": 3}}, {"name": "Regular expressions", "task": "Strip everything but digits, and match a pattern.", "sql": "SELECT REGEXP_REPLACE('+91 (20) 555-0101', '[^0-9]', '', 'g') AS digits,\n       'asha@mail.com' ~ '^[a-z]+@' AS looks_like_email;", "v": "replace", "io": [["'+91 (20) 555-0101'", "'91205550101'"], ["'asha@mail.com' ~ '^[a-z]+@'", "true"]], "result": {"cols": ["digits", "looks_like_email"], "rows": [["91205550101", "true"]], "total": 1}}]}, {"title": "Performance", "items": [{"name": "EXPLAIN", "task": "See the plan Postgres picks. Add ANALYZE to run it and get real timings.", "sql": "EXPLAIN (COSTS OFF)\nSELECT * FROM orders WHERE order_id = 105;", "v": "explain", "result": {"cols": ["QUERY PLAN"], "rows": [["Index Scan using orders_pkey on orders"], ["  Index Cond: (order_id = 105)"]], "total": 2}}, {"name": "Indexes", "task": "B-tree by default; GIN for JSONB and arrays; partial and expression indexes for targeted lookups.", "sql": "CREATE INDEX ON orders (customer_id);\nCREATE INDEX ON events USING GIN (data);\nCREATE INDEX ON orders (order_date) WHERE status = 'pending';\nCREATE INDEX ON customers (LOWER(email));", "v": "index", "result": {"cols": ["indexname"], "rows": [["customers_lower_idx"], ["customers_pkey"], ["events_data_idx"], ["orders_customer_id_idx"], ["orders_order_date_idx"], ["orders_pkey"]], "total": 6}, "show": "SELECT indexname FROM pg_indexes WHERE tablename IN ('orders', 'events', 'customers') ORDER BY indexname;"}]}]}, {"id": "interview", "title": "SQL Interview", "short": "Interview", "level": "All levels", "blurb": "Flip the cards to test yourself, then drill the classic problems, each with its real output.", "sections": [{"title": "Quick-fire concepts", "flip": true, "items": [{"name": "WHERE vs HAVING?", "desc": "WHERE filters rows before grouping; HAVING filters groups after aggregation. Aggregates are allowed only in HAVING."}, {"name": "Logical query order?", "desc": "FROM/JOIN, WHERE, GROUP BY, HAVING, window functions, SELECT, DISTINCT, ORDER BY, LIMIT."}, {"name": "UNION vs UNION ALL?", "desc": "UNION removes duplicates, which costs a sort or hash. UNION ALL keeps every row and is faster."}, {"name": "RANK vs DENSE_RANK?", "desc": "Both give ties the same number. RANK skips the next numbers (1,2,2,4); DENSE_RANK does not (1,2,2,3)."}, {"name": "DELETE vs TRUNCATE vs DROP?", "desc": "DELETE removes chosen rows; TRUNCATE empties the table fast; DROP removes the table itself."}, {"name": "Primary key vs unique key?", "desc": "Both enforce uniqueness. One primary key per table and it cannot be NULL; many unique keys are allowed."}, {"name": "What does an index cost?", "desc": "Faster reads on the indexed columns, paid for with storage and slower inserts and updates."}, {"name": "1NF, 2NF, 3NF?", "desc": "1NF: atomic values. 2NF: no partial dependency on a composite key. 3NF: no dependency between non-key columns."}, {"name": "Correlated subquery?", "desc": "A subquery that uses the outer row, so it runs per row. Often rewritable as a join or a window function."}, {"name": "COUNT(*) vs COUNT(col)?", "desc": "COUNT(*) counts rows; COUNT(col) counts non-NULL values in that column."}, {"name": "CTE vs subquery?", "desc": "Same power for most queries. CTEs name each step, can be referenced twice, and can be recursive."}, {"name": "NOT IN with NULLs?", "desc": "If the subquery returns a NULL, NOT IN matches nothing. Use NOT EXISTS instead."}]}, {"title": "Classic problems", "items": [{"name": "Second-highest salary", "task": "DENSE_RANK copes with ties: the answer is 95,000, not 120,000 or a duplicate.", "sql": "SELECT DISTINCT salary\nFROM (\n  SELECT salary, DENSE_RANK() OVER (ORDER BY salary DESC) AS r\n  FROM employees\n) t\nWHERE r = 2;", "v": "second", "result": {"cols": ["salary"], "rows": [["95000"]], "total": 1}}, {"name": "Earns more than their manager", "task": "Self join comparing an employee with their manager.", "sql": "SELECT e.name, e.salary, m.name AS manager, m.salary AS manager_salary\nFROM employees e\nJOIN employees m ON m.employee_id = e.manager_id\nWHERE e.salary > m.salary;", "v": "self", "result": {"cols": ["name", "salary", "manager", "manager_salary"], "rows": [["Noor", "82000", "Liam", "70000"]], "total": 1}}, {"name": "Top earner per department", "task": "One row per department.", "sql": "SELECT DISTINCT ON (dept) dept, name, salary\nFROM employees\nORDER BY dept, salary DESC;", "v": "topn", "result": {"cols": ["dept", "name", "salary"], "rows": [["Eng", "Maya", "120000"], ["Sales", "Noor", "82000"]], "total": 2}}, {"name": "Customers who never ordered", "task": "Anti-join with NOT EXISTS (NULL-safe, unlike NOT IN).", "sql": "SELECT name\nFROM customers c\nWHERE NOT EXISTS (\n  SELECT 1 FROM orders o WHERE o.customer_id = c.customer_id\n);", "v": "vanti", "result": {"cols": ["name"], "rows": [["Fay"]], "total": 1}}, {"name": "Repeat buyers", "task": "Customers with more than one order.", "sql": "SELECT customer_id, COUNT(*) AS orders\nFROM orders\nGROUP BY customer_id\nHAVING COUNT(*) > 1\nORDER BY orders DESC, customer_id;", "v": "dups", "result": {"cols": ["customer_id", "orders"], "rows": [["1", "3"], ["2", "2"], ["3", "2"], ["4", "2"]], "total": 4}}, {"name": "Log
