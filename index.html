in streaks (gaps and islands)", "task": "Consecutive login days per user: date minus row number is constant within a streak.", "sql": "WITH g AS (\n  SELECT user_id, day,\n         day - ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY day)::int AS grp\n  FROM logins\n)\nSELECT user_id, MIN(day) AS start_day, MAX(day) AS end_day, COUNT(*) AS streak\nFROM g\nGROUP BY user_id, grp\nHAVING COUNT(*) >= 3\nORDER BY user_id;", "v": "islands", "result": {"cols": ["user_id", "start_day", "end_day", "streak"], "rows": [["1", "2024-03-01", "2024-03-04", "4"], ["2", "2024-03-03", "2024-03-05", "3"]], "total": 2}}, {"name": "Running total", "task": "Cumulative revenue, order by order.", "sql": "SELECT order_id, amount,\n       SUM(amount) OVER (ORDER BY order_date ROWS UNBOUNDED PRECEDING) AS running\nFROM orders\nLIMIT 4;", "v": "running", "result": {"cols": ["order_id", "amount", "running"], "rows": [["101", "32.00", "32.00"], ["102", "36.00", "68.00"], ["103", "36.00", "104.00"], ["104", "27.50", "131.50"]], "total": 4}}, {"name": "Share of paid orders", "task": "Watch out for integer division.", "sql": "SELECT ROUND(100.0 * COUNT(*) FILTER (WHERE status = 'paid') / COUNT(*), 1) AS paid_pct\nFROM orders;", "v": "intdiv", "io": [["100.0 * 8 / 10", "80.0"]], "result": {"cols": ["paid_pct"], "rows": [["80.0"]], "total": 1}}]}]}], "samples": [{"name": "customers", "cols": ["customer_id", "name", "city", "signup_date", "email", "referred_by"], "rows": [["1", "Asha", "Pune", "2024-01-05", "asha@mail.com", "NULL"], ["2", "Ben", "Leeds", "2024-01-20", "ben@mail.com", "1"], ["3", "Chen", "Pune", "2024-02-11", "NULL", "1"], ["4", "Dee", "Austin", "2024-02-28", "dee@mail.com", "2"], ["5", "Eli", "Leeds", "2024-03-15", "eli@mail.com", "NULL"], ["6", "Fay", "Austin", "2024-03-30", "fay@mail.com", "4"]], "total": 6}, {"name": "products", "cols": ["product_id", "title", "category", "price"], "rows": [["1", "The Night Library", "Fiction", "18.00"], ["2", "Data Made Simple", "Data", "32.00"]   monthly: function () { var v = [30, 45, 40, 60, 72, 68, 85], pts = v.map(function (y, i) { return (20 + i * 36) + "," + (100 - y); }), s = '<polyline points="' + pts.join(" ") + '" fill="none" stroke="' + BL + '" stroke-width="3.5"/>'; pts.forEach(function (p) { var q = p.split(","); s += '<circle cx="' + q[0] + '" cy="' + q[1] + '" r="5" fill="' + P[0] + '" stroke="' + INK + '"/>'; }); return s; },
  growth: function () { return bars(30, 92, [50, 56, 52, 64], 34, 22, [P[3], P[1], P[1], P[1]]) + tx(103, 22, "+12%", { fs: 13, c: GRN }) + tx(159, 28, "−7%", { fs: 13, c: RED }) + tx(215, 14, "+23%", { fs: 13, c: GRN }); },
  fillgaps: function () { var s = bars(16, 96, [40, 55, 1, 1, 60, 45, 1, 50], 22, 8, [P[1]], 60); [76, 106, 196].forEach(function (x) { s += rc(x, 90, 22, 6, "#fff", { d: 1 }) + tx(x + 11, 84, "0", { fs: 12, c: BL }); }); return s + cap("missing days shown as 0"); },
  cohort: function () { var s = "", sh = [P[0], "#f7bfdc", "#fbd9ea", "#fdeaf3"]; for (var r = 0; r < 4; r++) for (var c = 0; c < 4 - r; c++) s += rc(60 + c * 36, 6 + r * 24, 34, 22, sh[c], { rx: 2 }); ["Jan", "Feb", "Mar", "Apr"].forEach(function (m, i) { s += tx(40, 22 + i * 24, m, { fs: 13, a: "end" }); }); return s; },
  funnel: function () { return rc(30, 10, 200, 24, P[1], { rx: 4 }) + tx(130, 27, "viewed 1000", { fs: 13, m: 1 }) + rc(60, 42, 140, 24, P[2], { rx: 4 }) + tx(130, 59, "cart 600", { fs: 13, m: 1 }) + rc(95, 74, 70, 24, P[0], { rx: 4 }) + tx(130, 91, "paid 250", { fs: 12, m: 1 }); },
  pivot: function () { return grid(14, 10, [[P[3], P[1], 0], [P[3], P[0], 0], [P[4], P[1], 0], [P[4], P[0], 0]], 26, 20) + ar(98, 50, 132, 50) + rc(144, 20, 34, 20, "#fff", { rx: 0 }) + rc(178, 20, 34, 20, P[1], { rx: 0 }) + rc(212, 20, 34, 20, P[0], { rx: 0 }) + tx(195, 35, "EU", { fs: 12, m: 1 }) + tx(229, 35, "US", { fs: 12, m: 1 }) + grid(144, 40, [[P[3], 0, 0], [P[4], 0, 0]], 34, 20) + cap("rows become columns"); },
  dedupe: function () { return grid(20, 14, [[P[0], -1], [P[0], -1], [P[0], P[5]], [P[1], P[5]]], 44, 20) + tx(140, 69, "← latest kept", { fs: 13, a: "start", c: GRN }) + cap("one row per email"); },
  normalize: function () { return chip(54, 24, "' Pune '", "#fff") + chip(54, 54, "'PUNE'", "#fff") + chip(54, 84, "'pune'", "#fff") + ar(100, 54, 140, 54) + chip(192, 54, "pune  × 3", P[0]); },
  psql: function () { return rc(10, 6, 240, 100, "#14121b", { rx: 8 }) + '<circle cx="24" cy="18" r="4" fill="#ff5f57"/><circle cx="36" cy="18" r="4" fill="#febc2e"/><circle cx="48" cy="18" r="4" fill="#28c840"/>' + tx(22, 44, "shop=# \\dt", { fs: 13, m: 1, a: "start", c: "#7ee0c3" }) + tx(22, 66, " customers | orders", { fs: 12, m: 1, a: "start", c: "#e6edf3" }) + tx(22, 88, "shop=# \\x auto", { fs: 13, m: 1, a: "start", c: "#7ee0c3" }); },
  identity: function () { return grid(60, 10, [[P[1], 0], [P[1], 0], [P[1], 0], [P[5], P[5]]], 50, 20) + tx(85, 25, "1", { fs: 13, m: 1 }) + tx(85, 45, "2", { fs: 13, m: 1 }) + tx(85, 65, "3", { fs: 13, m: 1 }) + tx(85, 85, "4", { fs: 13, m: 1 }) + tx(200, 85, "← auto", { fs: 14, c: GRN }); },
  types: function () { return chip(66, 30, "TEXT", P[3]) + chip(190, 30, "NUMERIC(10,2)", P[1]) + chip(66, 72, "TIMESTAMPTZ", P[0]) + chip(190, 72, "JSONB", P[2]); },
  json: function () { return chip(60, 56, "data", P[2]) + ar(92, 50, 136, 28) + ar(92, 62, 136, 84) + chip(186, 28, "->>'email'", P[3]) + chip(186, 84, "->'address'->>'city'", P[0]); },
  array: function () { return chip(50, 40, "sql", P[0]) + chip(110, 40, "postgres", "#fff") + chip(176, 40, "tips", "#fff") + tx(130, 86, "'sql' = ANY(tags)  ✓", { fs: 14, m: 1, c: GRN }); },
  upsert: function () { return chip(50, 56, "sku A1", P[3]) + ar(84, 50, 130, 26) + ar(84, 62, 130, 86) + chip(186, 26, "new → INSERT", P[5]) + chip(186, 86, "exists → UPDATE", P[1]); },
  returning: function () { return grid(30, 30, [[0, 0], [P[1], P[1]], [0, 0]], 40, 20) + '<path d="M112,50 C150,10 190,10 214,40" stroke="' + P[0] + '" stroke-width="2.6" fill="none" marker-end="url(#ah)"/>' + chip(220, 62, "row", P[0]) + cap("changed row comes back"); },
  distincton: function () { return grid(30, 10, [[P[0], -1], [P[0], P[5]], [P[1], -1], [P[1], P[5]]], 44, 20) + tx(130, 49, "← newest per customer", { fs: 13, a: "start", c: GRN }) + tx(130, 89, "←", { fs: 13, a: "start", c: GRN }); },
  series: function () { var s = ""; for (var i = 1; i <= 5; i++) s += chip(16 + i * 38, 34, String(i), P[i % 5]); return s + chip(130, 80, "Jan 1 … Jan 7", P[3]); },
  recursive: function () { return rc(105, 4, 50, 22, P[2], { rx: 11 }) + tx(130, 20, "CEO", { fs: 12, m: 1 }) + ln(130, 26, 70, 46, P[0], 3) + ln(130, 26, 190, 46) + rc(45, 46, 50, 22, P[0], { rx: 11 }) + tx(70, 62, "VP", { fs: 12, m: 1 }) + rc(165, 46, 50, 22, "#fff", { rx: 11 }) + tx(190, 62, "VP", { fs: 12, m: 1 }) + ln(70, 68, 70, 86, P[0], 3) + rc(45, 86, 50, 22, P[0], { rx: 11 }) + tx(70, 102, "#7", { fs: 12, m: 1 }) + tx(180, 100, "walks up the chain", { fs: 13, c: "#ff9fd0" }); },
  explain: function () { return rc(80, 6, 100, 24, P[2], { rx: 6 }) + tx(130, 23, "Hash Join", { fs: 12, m: 1 }) + ln(130, 30, 70, 50) + ln(130, 30, 190, 50) + rc(14, 50, 112, 24, P[5], { rx: 6 }) + tx(70, 67, "Index Scan", { fs: 12, m: 1 }) + rc(134, 50, 112, 24, P[0], { rx: 6 }) + tx(190, 67, "Seq Scan", { fs: 12, m: 1 }) + tx(70, 94, "0.2 ms", { fs: 13, c: GRN }) + tx(190, 94, "48 ms", { fs: 13, c: RED }); },
  index: function () { return rc(100, 6, 60, 22, P[2], { rx: 4 }) + ln(110, 28, 50, 50) + ln(130, 28, 130, 50) + ln(150, 28, 210, 50) + rc(20, 50, 60, 22, P[1], { rx: 4 }) + rc(100, 50, 60, 22, P[1], { rx: 4 }) + rc(180, 50, 60, 22, P[1], { rx: 4 }) + tx(130, 98, "B-tree: jump, don't scan", { fs: 14, c: BL }); },
  second: function () { return bars(24, 96, [100, 88, 88, 70, 55], 30, 14, [GR, P[0], P[0], GR, GR], 100) + tx(83, 14, "2nd = 88", { fs: 14, c: "#ff9fd0" }); },
  dups: function () { return chip(70, 24, "ana@x.io", P[0]) + chip(70, 52, "ana@x.io", P[0]) + chip(70, 80, "raj@x.io", "#fff") + ar(120, 38, 160, 38) + chip(206, 38, "ana@x.io  2", P[0]); },
  islands: function () { var on = [1, 1, 0, 1, 1, 1, 1, 0, 1, 0], s = ""; on.forEach(function (o, i) { s += rc(12 + i * 24, 36, 20, 20, o ? (i >= 3 && i <= 6 ? P[0] : P[3]) : "#fff", { rx: 4 }); }); return s + ln(84, 66, 178, 66, "#ff9fd0", 3) + tx(131, 88, "4-day streak", { fs: 14, c: "#ff9fd0" }); }
};


function viz(it) {
  var body = it.io ? ioFit(it.io) : (it.v && VZ[it.v] ? VZ[it.v]() : "");
  if (!body) return "";
  vizUid++;
  return '<div class="viz"><svg viewBox="0 0 260 120" role="img" aria-label="Diagram: ' + esc(it.name) + '">' + body.replace(/vc-in/g, "vc" + vizUid) + '</svg></div>';
}
var vizUid = 0;

function codeBlock(code) { return '<div class="code"><button class="copy" type="button">copy</button><pre>' + hl(code) + '</pre></div>'; }
function isNum(v) { return /^-?\d+(\.\d+)?$/.test(v); }
function table(r) {
  return '<div class="tbl"><table><thead><tr>' + r.cols.map(function (c) { return "<th>" + esc(c) + "</th>"; }).join("") + '</tr></thead><tbody>' +
    r.rows.map(function (row) { return "<tr>" + row.map(function (v) { return '<td class="' + (v === "NULL" ? "null" : isNum(v) ? "num" : "") + '">' + esc(v) + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table></div>";
}
function resultBlock(r) {
  if (!r) return "";
  if (r.error) return '<div class="res-label err">Postgres says</div><div class="err-box">ERROR: ' + esc(r.error) + '</div>';
  var more = r.total && r.total > r.rows.length ? '<span class="more">first ' + r.rows.length + ' of ' + r.total + ' rows</span>' : (r.total != null ? '<span class="more">' + r.total + (r.total === 1 ? " row" : " rows") + '</span>' : '<span class="more">example output</span>');
  return '<div class="res-label">Result ' + more + '</div>' + table(r);
}
var searchIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';
function topbar(crumb) {
  return '<div class="topbar"><a class="brand" href="#">SQL Cheat Sheets</a><div class="crumbs">' + (crumb ? '<a href="#">Hub</a><span aria-hidden="true">/</span><span>' + esc(crumb) + '</span>' : '<span>8 sheets · real Postgres results · mind maps</span>') + '</div></div>';
}
function footer() { return '<footer><span>Every result was produced by running the query in PostgreSQL 14 against the sample data. Progress is saved in this browser only.</span><span class="sign">Sagarika</span></footer>'; }
function total() { return SHEETS.reduce(function (n, s) { return n + countItems(s); }, 0); }

/* ---------------- views ---------------- */
var app = document.getElementById("app"), pending = null;

function hub() {
  var branches = SHEETS.map(function (s) {
    return { label: s.short, go: s.id, leaves: s.sections.map(function (sec) { return { label: sec.title, go: s.id + "|" + slug(sec.title) }; }) };
  });
  var flowCols = ["#7fd0ff", "#ff6b5e", "#c3b1f2", "#ffb38a", "#f39ac8", "#9fe3c9", "#9fe3c9", "#8fb8ee", "#e3dbc9"];
  var flow = ["FROM / JOIN", "WHERE", "GROUP BY", "HAVING", "WINDOW", "SELECT", "DISTINCT", "ORDER BY", "LIMIT"].map(function (c, i) { return '<span style="background:' + flowCols[i] + '">' + c + '</span>'; }).join("<i>→</i>");
  var skeleton = "SELECT   columns, aggregates, window functions\nFROM     table\nJOIN     other_table ON condition\nWHERE    row filter\nGROUP BY columns\nHAVING   group filter\nORDER BY columns\nLIMIT    n;";
  app.innerHTML = topbar() +
    '<header class="hero"><div class="eyebrow">Interactive · illustrated · real results</div>' +
    '<h1>SQL Cheat <span class="hl">Sheets</span></h1>' +
    '<p class="lede">Eight sheets on one map: basics to window functions, data analysis recipes, PostgreSQL and interview drills. Every example states the task, shows the query and shows the real result it returns.</p>' +
    '<div class="stats"><span class="stat"><b>' + SHEETS.length + '</b> sheets</span><span class="stat"><b>' + total() + '</b> examples</span><span class="stat"><b>1</b> shared dataset</span><span class="stat">results from <b>PostgreSQL 14</b></span></div>' +
    '<div class="search">' + searchIcon + '<input id="q" type="search" placeholder="Search: LAG, upsert, HAVING, median, pivot..." aria-label="Search all cheat sheets" autocomplete="off"></div>' +
    '<div class="results" id="results"></div></header>' +
    '<figure class="panel mindmap" style="margin:0">' + mindmap("SQL", branches, { label: "Mind map of all eight SQL cheat sheets and their sections", maxLeaves: 8 }) + '</figure>' +
    '<div class="map-cap"><span>Click a pill to open a sheet. <em>Click a dot</em> to jump to that section.</span></div>' +
    '<h2 class="section-title">All sheets</h2><p class="section-sub">Pick one, or follow the order: Basics, Joins, Aggregates, Functions, Window, then Data Analysis.</p><div class="sheets">' +
    SHEETS.map(function (s) {
      var tot = countItems(s), g = countGot(s);
      return '<button class="sheet-card" type="button" data-go="' + s.id + '"><div class="sc-top"><span class="dot" style="background:' + SHEET_COLORS[s.id] + '"></span><span class="level">' + esc(s.level) + '</span></div>' +
        '<h3>' + esc(s.title) + '</h3><p>' + esc(s.blurb) + '</p><div class="bar" aria-hidden="true"><span style="width:' + Math.round(100 * g / tot) + '%"></span></div>' +
        '<div class="sc-meta">' + g + ' of ' + tot + ' learned · ' + s.sections.length + ' sections</div></button>';
    }).join("") + '</div>' +
    '<h2 class="section-title">Ultimate quick reference</h2><p class="section-sub">The two things to keep in your head for every query, and the data all the examples use.</p>' +
    '<div class="ref"><div class="ref-card"><h3>Query skeleton</h3>' + codeBlock(skeleton) + '</div>' +
    '<div class="ref-card"><h3>The order SQL actually runs in</h3><div class="flow">' + flow + '</div><p style="color:var(--muted)">A clause can only see what ran before it. That is why <code class="inline">WHERE</code> cannot use aggregates, aliases or window results, and why <code class="inline">ORDER BY</code> can.</p>' +
    '<div class="legend-row"><span><b>WHERE</b> rows</span><span><b>HAVING</b> groups</span><span><b>QUALIFY</b> window results (not in Postgres)</span></div></div></div>' +
    '<h2 class="section-title">The sample data</h2><p class="section-sub">A small online bookshop. Every example in every sheet runs against these tables (orders has 10 rows; the first 6 are shown).</p>' +
    '<div class="samples">' + DATA.samples.map(function (t) { return '<div class="sample"><h4>' + esc(t.name) + '</h4>' + table(t) + '</div>'; }).join("") + '</div>' +
    footer();
  var q = document.getElementById("q"), res = document.getElementById("results");
  q.addEventListener("input", function () {
    var t = q.value.trim().toLowerCase();
    if (t.length < 2) { res.innerHTML = ""; return; }
    var hits = [];
    SHEETS.forEach(function (s) { s.sections.forEach(function (sec) { sec.items.forEach(function (it) {
      var hay = (it.name + " " + (it.task || "") + " " + (it.desc || "") + " " + (it.sql || "") + " " + sec.title).toLowerCase();
      if (hay.indexOf(t) >= 0) hits.push({ s: s, it: it });
    }); }); });
    res.innerHTML = hits.length ? hits.slice(0, 12).map(function (h) {
      return '<button class="result" type="button" data-go="' + h.s.id + "|item-" + slug(h.it.name) + '"><span class="r-sheet">' + esc(h.s.short) + '</span><span class="r-name">' + esc(h.it.name) + '</span><span class="r-desc">' + esc(h.it.task || h.it.desc) + '</span></button>';
    }).join("") + (hits.length > 12 ? '<p class="empty">' + (hits.length - 12) + ' more. Keep typing to narrow it down.</p>' : "") : '<p class="empty">Nothing matches "' + esc(q.value) + '" yet.</p>';
  });
}

function sheet(s) {
  var idx = SHEETS.indexOf(s), prev = SHEETS[(idx + SHEETS.length - 1) % SHEETS.length], next = SHEETS[(idx + 1) % SHEETS.length];
  var branches = s.sections.map(function (sec) {
    return { label: sec.title, go: s.id + "|" + slug(sec.title),
      leaves: sec.items.map(function (it) { return { label: it.name.length > 22 ? it.name.slice(0, 21) + "…" : it.name, go: s.id + "|item-" + slug(it.name) }; }) };
  });
  var html = topbar(s.title) +
    '<header class="sheet-head"><div class="row"><span class="level">' + esc(s.level) + '</span><span class="sc-meta" id="prog"></span></div>' +
    '<h1>' + esc(s.title) + '</h1><p class="lede">' + esc(s.blurb) + '</p></header>' +
    '<figure class="panel mindmap" style="margin:0">' + mindmap(s.short, branches, { label: "Mind map of the " + s.title + " sheet", maxLeaves: 12 }) + '</figure>' +
    '<div class="map-cap"><span>Every leaf is an example below. <em>Click one</em> to jump to it.</span></div>' +
    '<nav class="chips" aria-label="Sections">' + s.sections.map(function (sec) { return '<button class="chip-btn" type="button" data-go="' + s.id + "|" + slug(sec.title) + '">' + esc(sec.title) + '</button>'; }).join("") + '</nav>';
  s.sections.forEach(function (sec) {
    html += '<section class="sec" id="' + slug(sec.title) + '"><div class="sec-head"><h2>' + esc(sec.title) + '</h2><span class="sec-count">' + sec.items.length + (isFlip(sec) ? ' cards' : ' examples') + '</span></div><div class="items">';
    sec.items.forEach(function (it) {
      var key = itemKey(s, it), id = "item-" + slug(it.name);
      if (isFlip(sec)) {
        html += '<button class="flip" type="button" id="' + id + '" aria-label="Flip card: ' + esc(it.name) + '"><div class="flip-inner"><div class="face front"><div class="q">' + esc(it.name) + '</div><div class="hint">tap to reveal</div></div><div class="face back"><div class="a">' + esc(it.desc) + '</div></div></div></button>';
        return;
      }
      html += '<article class="item" id="' + id + '"><div class="item-head"><div class="item-name">' + esc(it.name) + '</div>' +
        '<label class="got"><input type="checkbox" data-key="' + key + '"' + (got[key] ? " checked" : "") + '> got it</label></div>' +
        viz(it) + '<p class="task">' + esc(it.task) + '</p>' + codeBlock(it.sql) + resultBlock(it.result) +
        (it.note ? '<div class="note"><span aria-hidden="true">👉</span><p>' + esc(it.note) + '</p></div>' : "") + '</article>';
    });
    html += "</div></section>";
  });
  html += '<div class="pager"><button type="button" data-go="' + prev.id + '"><small>Previous</small>' + esc(prev.title) + '</button><button type="button" data-go="' + next.id + '"><small>Next</small>' + esc(next.title) + '</button></div>' + footer();
  app.innerHTML = html;
  updateProg(s);
}
function updateProg(s) { var p = document.getElementById("prog"); if (p) p.textContent = countGot(s) + " of " + countItems(s) + " learned"; }

function route() {
  var id = location.hash.replace(/^#/, "");
  var s = SHEETS.filter(function (x) { return x.id === id; })[0];
  if (s) sheet(s); else hub();
  if (pending) { var el = document.getElementById(pending); pending = null; if (el) { el.scrollIntoView({ behavior: "smooth", block: "start" }); if (el.classList.contains("item") || el.classList.contains("flip")) { el.classList.add("flash"); setTimeout(function () { el.classList.remove("flash"); }, 1700); } } }
  else window.scrollTo(0, 0);
}
function go(target) {
  var parts = target.split("|"), id = parts[0];
  pending = parts[1] || null;
  if (location.hash.replace(/^#/, "") === id) route(); else location.hash = id;
}

app.addEventListener("click", function (e) {
  var g = e.target.closest("[data-go]");
  if (g && g.getAttribute("data-go")) { e.preventDefault(); go(g.getAttribute("data-go")); return; }
  var c = e.target.closest(".copy");
  if (c) {
    var pre = c.parentNode.querySelector("pre"), txt = pre.textContent;
    var sel = function () { var r = document.createRange(); r.selectNodeContents(pre); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); c.textContent = "selected"; };
    try { navigator.clipboard.writeText(txt).then(function () { c.textContent = "copied"; }, sel); } catch (err) { sel(); }
    setTimeout(function () { c.textContent = "copy"; }, 1500); return;
  }
  var f = e.target.closest(".flip");
  if (f) { f.classList.toggle("on"); }
});
app.addEventListener("keydown", function (e) {
  var n = e.target.closest && e.target.closest(".node");
  if (n && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); go(n.getAttribute("data-go")); }
});
app.addEventListener("change", function (e) {
  var k = e.target.getAttribute && e.target.getAttribute("data-key");
  if (!k) return;
  if (e.target.checked) got[k] = 1; else delete got[k];
  store.set(got);
  var s = SHEETS.filter(function (x) { return x.id === k.split(":")[0]; })[0];
  if (s) updateProg(s);
});
window.addEventListener("hashchange", route);
route();
})();
</script>
